<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>탕탕 - Survivor</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, SCALE = 1;
const MODE_KEY = 'tangtang_mode';
let MODE = (() => {   // 'pc' | 'mobile' (저장된 값이 없으면 터치 기기는 모바일)
  try { const m = localStorage.getItem(MODE_KEY); if (m === 'pc' || m === 'mobile') return m; } catch (e) {}
  return typeof navigator !== 'undefined' && navigator.maxTouchPoints > 0 ? 'mobile' : 'pc';
})();
function resize(){   // 모바일: 작은 화면에서도 UI 가 모두 들어오도록 가상 해상도를 키워 축소 표시
  SCALE = MODE === 'mobile' ? Math.min(1, innerWidth / 720, innerHeight / 640) : 1;
  W = cv.width = Math.round(innerWidth / SCALE); H = cv.height = Math.round(innerHeight / SCALE);
}
function setMode(m) { MODE = m; try { localStorage.setItem(MODE_KEY, m); } catch (e) {} touchStick = null; resize(); }
addEventListener('resize', resize); resize();

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (state === 'auth') { authKey(e); return; }
  if (state === 'levelup' && ['1','2','3'].includes(k)) pick(+k - 1);
  if ((state === 'over' || state === 'win') && (k === 'r' || k === 'enter')) start();
  if (state === 'title' && (k === 'enter' || k === ' ')) start();
  if ((state === 'title' || state === 'over' || state === 'win') && k === 's') openShop();
  if (state === 'shop' && (k === 'escape' || k === 'backspace')) { if (shopConfirm) shopConfirm = false; else closeShop(); }
  if ((state === 'title' || state === 'levelup') && k === 'c') { openCodex(); return; }
  if ((state === 'title' || state === 'levelup') && k === 'e') { openBest(); return; }
  if (state === 'bestiary' && (k === 'escape' || k === 'backspace' || k === 'e')) { if (bestSel !== null) bestSel = null; else closeBest(); }
  if (state === 'bestiary' && (k === 'arrowdown' || k === 'pagedown')) bsScroll = Math.min(bsMax, bsScroll + 80);
  if (state === 'bestiary' && (k === 'arrowup' || k === 'pageup')) bsScroll = Math.max(0, bsScroll - 80);
  if (state === 'codex' && (k === 'escape' || k === 'backspace' || k === 'c')) closeCodex();
  if (state === 'codex' && (k === 'arrowdown' || k === 'pagedown')) cxScroll = Math.min(cxMax, cxScroll + 80);
  if (state === 'codex' && (k === 'arrowup' || k === 'pageup')) cxScroll = Math.max(0, cxScroll - 80);
  if (state === 'changelog' && (k === 'escape' || k === 'backspace' || k === 'enter')) state = 'title';
  if (state === 'changelog' && (k === 'arrowdown' || k === 'pagedown')) clScroll = Math.min(clMax, clScroll + 80);
  if (state === 'changelog' && (k === 'arrowup' || k === 'pageup')) clScroll = Math.max(0, clScroll - 80);
  if (state === 'shop' && (k === '1' || k === '2' || k === '3')) { shopTab = +k - 1; shopScroll = 0; }
  if (state === 'shop' && (k === 'arrowdown' || k === 'pagedown')) shopScroll = Math.min(shopMax, shopScroll + 80);
  if (state === 'shop' && (k === 'arrowup' || k === 'pageup')) shopScroll = Math.max(0, shopScroll - 80);
  if (k === 'escape' && state === 'info') state = infoFrom;
  else if (k === 'escape' && state === 'play') state = 'pause';
  else if (k === 'escape' && state === 'pause') state = 'play';
  if (state === 'over' && k === 'v') reviveWithGold();
  if ((state === 'win' || state === 'over') && k === 'escape') state = 'title';
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
let mouse = {x:0,y:0};
cv.addEventListener('wheel', e => {
  if (state === 'shop') { shopScroll = Math.max(0, Math.min(shopMax, shopScroll + e.deltaY)); e.preventDefault(); }
  else if (state === 'bestiary') { bsScroll = Math.max(0, Math.min(bsMax, bsScroll + e.deltaY)); e.preventDefault(); }
  else if (state === 'codex') { cxScroll = Math.max(0, Math.min(cxMax, cxScroll + e.deltaY)); e.preventDefault(); }
  else if (state === 'changelog') { clScroll = Math.max(0, Math.min(clMax, clScroll + e.deltaY)); e.preventDefault(); }
}, { passive:false });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX / SCALE; mouse.y = e.clientY / SCALE; });
cv.addEventListener('click', e => {
  if (Date.now() < noClickUntil) return;   // 드래그(스크롤) 직후의 클릭은 무시
  const ex = e.clientX / SCALE, ey = e.clientY / SCALE;
  if (state === 'levelup') {
    let hitCard = false;
    cardRects.forEach((r,i) => { if (!hitCard && ex>=r.x && ex<=r.x+r.w && ey>=r.y && ey<=r.y+r.h) { hitCard = true; pick(i); } });
    if (!hitCard) for (const b of btns) if (ex >= b.x && ex <= b.x + b.w && ey >= b.y && ey <= b.y + b.h) { b.fn(); break; }
  } else if (state === 'info') {
    const hit = btns.find(b => ex >= b.x && ex <= b.x + b.w && ey >= b.y && ey <= b.y + b.h);
    if (hit) hit.fn();
    else if (!infoCard || ex < infoCard.x || ex > infoCard.x + infoCard.w || ey < infoCard.y || ey > infoCard.y + infoCard.h) state = infoFrom;
  } else if (state === 'play' || state === 'pause') {
    if (pauseRect && ex >= pauseRect.x && ex <= pauseRect.x + pauseRect.w && ey >= pauseRect.y && ey <= pauseRect.y + pauseRect.h) { state = state === 'play' ? 'pause' : 'play'; return; }
    const h = hudRects.find(r => ex >= r.x && ex <= r.x + r.w && ey >= r.y && ey <= r.y + r.h);
    if (enemyRect && ex >= enemyRect.x && ex <= enemyRect.x + enemyRect.w && ey >= enemyRect.y && ey <= enemyRect.y + enemyRect.h) openBest();
    else if (codexRect && ex >= codexRect.x && ex <= codexRect.x + codexRect.w && ey >= codexRect.y && ey <= codexRect.y + codexRect.h) openCodex();
    else if (h) { infoKey = h.k; infoSel = Math.max(1, P.w[h.k]); infoFrom = state; state = 'info'; }
    else if (state === 'pause') for (const b of btns) if (ex >= b.x && ex <= b.x + b.w && ey >= b.y && ey <= b.y + b.h && (b.y0 === undefined || (ey >= b.y0 && ey <= b.y1))) { b.fn(); break; }
  } else if (state === 'over' || state === 'win' || state === 'title' || state === 'shop' || state === 'changelog' || state === 'codex' || state === 'bestiary' || state === 'auth') {
    for (const b of btns) if (ex >= b.x && ex <= b.x + b.w && ey >= b.y && ey <= b.y + b.h && (b.y0 === undefined || (ey >= b.y0 && ey <= b.y1))) { b.fn(); break; }
  }
});

// ---------- 터치 (모바일 모드) ----------
let touchStick = null, touchDrag = null, noClickUntil = 0, pauseRect = null;
const STICK_R = 60;   // 조이스틱 반경: 이보다 멀리 끌면 기준점이 따라와 방향 전환이 빠름
const SCROLLERS = {
  shop:      d => { shopScroll = Math.max(0, Math.min(shopMax, shopScroll + d)); },
  codex:     d => { cxScroll = Math.max(0, Math.min(cxMax, cxScroll + d)); },
  bestiary:  d => { bsScroll = Math.max(0, Math.min(bsMax, bsScroll + d)); },
  changelog: d => { clScroll = Math.max(0, Math.min(clMax, clScroll + d)); },
};
cv.addEventListener('touchstart', e => {
  const t = e.changedTouches[0], x = t.clientX / SCALE, y = t.clientY / SCALE;
  mouse.x = x; mouse.y = y;
  if (MODE === 'mobile' && state === 'play' && !touchStick) touchStick = { id:t.identifier, sx:x, sy:y, x, y };
  touchDrag = { id:t.identifier, y0:y, y, moved:false };
}, { passive:true });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const x = t.clientX / SCALE, y = t.clientY / SCALE;
    if (touchStick && t.identifier === touchStick.id) {
      touchStick.x = x; touchStick.y = y;
      const vx = x - touchStick.sx, vy = y - touchStick.sy, d = Math.hypot(vx, vy);
      if (d > STICK_R) { touchStick.sx = x - vx / d * STICK_R; touchStick.sy = y - vy / d * STICK_R; }
    }
    if (touchDrag && t.identifier === touchDrag.id) {
      if (Math.abs(y - touchDrag.y0) > 12) touchDrag.moved = true;
      if (touchDrag.moved && SCROLLERS[state]) SCROLLERS[state](touchDrag.y - y);
      touchDrag.y = y;
    }
  }
}, { passive:false });
function touchEnd(e) {
  for (const t of e.changedTouches) {
    if (touchStick && t.identifier === touchStick.id) touchStick = null;
    if (touchDrag && t.identifier === touchDrag.id) { if (touchDrag.moved && SCROLLERS[state]) noClickUntil = Date.now() + 350; touchDrag = null; }
  }
}
cv.addEventListener('touchend', touchEnd); cv.addEventListener('touchcancel', touchEnd);

// ---------- 유틸 ----------
const rand = (a,b) => a + Math.random()*(b-a);
const dist2 = (a,b) => (a.x-b.x)**2 + (a.y-b.y)**2;
function nearest(from, list, maxD = Infinity) {
  let best = null, bd = maxD*maxD;
  for (const e of list) { const d = dist2(from, e); if (d < bd) { bd = d; best = e; } }
  return best;
}

// ---------- 저장 데이터 (골드/상점) ----------
const SAVE_KEY = 'tangtang_save_v1';
let SAVE = { gold:0, up:{}, aff:{}, chars:{ ninja:true }, char:'ninja' };
// 계정은 이 브라우저(localStorage)에만 저장됩니다. 서버가 없어서 다른 기기와는 공유되지 않습니다.
const ACC_KEY = 'tangtang_accounts_v1', SESSION_KEY = 'tangtang_session_v1';
let ACCOUNT = null;   // 로그인한 계정 키 (소문자 아이디), 비로그인이면 null (게스트 저장 사용)
function readAccounts() { try { return JSON.parse(localStorage.getItem(ACC_KEY)) || {}; } catch (e) { return {}; } }
function writeAccounts(a) { try { localStorage.setItem(ACC_KEY, JSON.stringify(a)); } catch (e) {} }
function normSave(j) {
  const o = Object.assign({ gold:0, up:{}, aff:{}, chars:{ ninja:true }, char:'ninja' }, j || {});
  o.up = o.up || {}; o.aff = o.aff || {}; o.chars = o.chars || { ninja:true }; o.char = o.char || 'ninja'; return o;
}
function loadSave() {
  let g = null; try { g = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) {}
  SAVE = normSave(g); ACCOUNT = null;
  try { const k = localStorage.getItem(SESSION_KEY), a = readAccounts(); if (k && a[k]) { ACCOUNT = k; SAVE = normSave(a[k].save); } } catch (e) {}
}
function persist() {
  try {
    if (ACCOUNT) { const a = readAccounts(); if (a[ACCOUNT]) { a[ACCOUNT].save = SAVE; writeAccounts(a); return; } }
    localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE));
  } catch (e) {}
}
const NAME_RE = /^[A-Za-z0-9_]{2,16}$/;
function fallbackHash(pw, salt) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57; const str = salt + pw;
  for (let r = 0; r < 3000; r++) for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  return 'f:' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}
async function hashPw(pw, salt, alg) {
  if (alg !== 'f') {
    try {
      if (typeof crypto !== 'undefined' && crypto.subtle) {
        const enc = new TextEncoder(), key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode(salt), iterations:100000, hash:'SHA-256' }, key, 256);
        return 'p:' + [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) {}
  }
  return fallbackHash(pw, salt);
}
function newSalt() { let s = ''; for (let i = 0; i < 16; i++) s += Math.floor(Math.random() * 16).toString(16); return s; }
async function signUp(name, pw, pw2) {
  if (!NAME_RE.test(name)) return '아이디는 영문·숫자·_ 2~16자로 입력하세요';
  if (pw.length < 4) return '비밀번호는 4자 이상이어야 합니다';
  if (pw !== pw2) return '비밀번호 확인이 일치하지 않습니다';
  const acc = readAccounts(), key = name.toLowerCase();
  if (acc[key]) return '이미 사용 중인 아이디입니다';
  const salt = newSalt(), hash = await hashPw(pw, salt);
  acc[key] = { name, salt, hash, save:normSave(null) };   // 새 계정은 항상 처음부터 시작
  writeAccounts(acc); try { localStorage.setItem(SESSION_KEY, key); } catch (e) {}
  ACCOUNT = key; SAVE = normSave(acc[key].save); return null;
}
async function logIn(name, pw) {
  const acc = readAccounts(), key = name.toLowerCase(), a = acc[key];
  if (!a) return '존재하지 않는 아이디입니다';
  const h = await hashPw(pw, a.salt, a.hash.startsWith('f:') ? 'f' : 'p');
  if (h !== a.hash) return '비밀번호가 틀렸습니다';
  try { localStorage.setItem(SESSION_KEY, key); } catch (e) {}
  ACCOUNT = key; SAVE = normSave(a.save); return null;
}
async function deleteAccount(pw) {
  const acc = readAccounts(), a = acc[ACCOUNT];
  if (!a) return '로그인 상태가 아닙니다';
  const h = await hashPw(pw, a.salt, a.hash.startsWith('f:') ? 'f' : 'p');
  if (h !== a.hash) return '비밀번호가 틀렸습니다';
  delete acc[ACCOUNT]; writeAccounts(acc);
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  loadSave(); return null;
}
function logOut() { persist(); try { localStorage.removeItem(SESSION_KEY); } catch (e) {} loadSave(); }
loadSave();
const upLv = id => SAVE.up[id] || 0;

            particles.push({ s:rand(3, 8), x:m.x + Math.cos(m.ba)*30, y:m.y + Math.sin(m.ba)*30, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:0.35, c:['#ef4444','#fb923c','#fde047'][i % 3] }); }
        }
        if (m.bT <= 0) m.cdT = 0.8;
      } else if (tg) {
        const d = Math.hypot(tg.x - m.x, tg.y - m.y);
        if (d > sp.range * 0.7) steer(m, tg.x, tg.y, sp.spd); else m.face = tg.x >= m.x ? 1 : -1;
        if (m.cdT <= 0 && d < sp.range) { m.bT = 1.3; m.ba = Math.atan2(tg.y - m.y, tg.x - m.x); m.tick = 0; }
      } else idle();
    } else {                                                    // 거대 골렘: 대지 강타
      if (tg) steer(m, tg.x, tg.y, sp.spd); else idle();
      if (m.aoeT <= 0 && enemies.some(e => dist2(m, e) < (190 + e.r)**2)) {
        m.aoeT = 1.0; explode(m.x, m.y, sp.aoe, sp.dmg, '#38bdf8');
        particles.push({ x:m.x, y:m.y, ring:sp.aoe*0.6, t:0.4, tmax:0.4, c:'#e0f2fe' });
      }
    }
    { const dx = m.x - P.x, dy = m.y - P.y, dd = Math.hypot(dx, dy); if (dd > MINION_LEASH) { m.x = P.x + dx / dd * MINION_LEASH; m.y = P.y + dy / dd * MINION_LEASH; } }   // 플레이어로부터 일정 거리 안에서만 활동
  }
}

function guardianSpec() {
  const g = lvl('guardian');
  if (g >= 7) return { n:6, rad:115, spd:6.5, r:27, dmg:60, cd:0.25, gear:true };
  return { n:g, rad:70 + g*3, spd:3 + g*0.3, r:11 + g, dmg:20 + g*6, cd:0.4, gear:false };
}
function droneCount() { const d = lvl('drone'); return d >= 7 ? 6 : d; }

function updateWeapons(dt) {
  const cm = cdMul();
  if (lvl('kunai'))    { P.cd.kunai -= dt;    if (P.cd.kunai <= 0 && fireKunai())       P.cd.kunai = (lvl('kunai') >= 7 ? 0.55 : Math.max(0.3, 0.9 - 0.08*lvl('kunai'))) * cm; }
  if (lvl('shuriken')) { P.cd.shuriken -= dt; if (P.cd.shuriken <= 0 && throwShuriken()) P.cd.shuriken = (lvl('shuriken') >= 7 ? 2.6 : 2.2 - 0.12*lvl('shuriken')) * cm; }
  if (lvl('molotov'))  { P.cd.molotov -= dt;  if (P.cd.molotov <= 0 && throwMolotov())  P.cd.molotov = (lvl('molotov') >= 7 ? 1.3 : 2.4 - 0.2*lvl('molotov')) * cm; }
  if (lvl('rocket'))   { P.cd.rocket -= dt;   if (P.cd.rocket <= 0 && fireRocket())     P.cd.rocket = (lvl('rocket') >= 7 ? 1.6 : 2.8 - 0.2*lvl('rocket')) * cm; }

  if (lvl('lightning')) { P.cd.lightning -= dt; if (P.cd.lightning <= 0 && castLightning()) P.cd.lightning = (lvl('lightning') >= 7 ? 1.4 : 2.4 - 0.18*lvl('lightning')) * cm; }
  if (lvl('brick'))     { P.cd.brick -= dt;     if (P.cd.brick <= 0 && throwBricks())      P.cd.brick = (lvl('brick') >= 7 ? 2.0 : 2.8 - 0.22*lvl('brick')) * cm; }
  if (lvl('laser'))     { P.cd.laser -= dt;     if (P.cd.laser <= 0 && fireLaser())        P.cd.laser = (lvl('laser') >= 7 ? 5 : 3.4 - 0.22*lvl('laser')) * cm; }
  updateDrills(dt);
  if (lvl('soccer'))    { P.cd.soccer -= dt;    if (P.cd.soccer <= 0 && kickBall())        P.cd.soccer = (lvl('soccer') >= 7 ? 2.2 : 2.6 - 0.18*lvl('soccer')) * cm; }
  updateMinions(dt); updateLasers(dt);
  // 방어막
  if (lvl('shield')) {   // 방어막 안의 적에게 지속 피해
    P.spikeT -= dt;
    if (P.spikeT <= 0) { P.spikeT = 0.4; const R = shieldR(), dmg = lvl('shield') >= 7 ? 45 : 6 + 5 * lvl('shield');
      for (const e of enemies) if ((e.x-P.x)**2 + (e.y-P.y)**2 < (R + e.r)**2) damageEnemy(e, dmg, (e.x-P.x)*0.5, (e.y-P.y)*0.5); }
  }
  // 질풍 신발 오라
  if (lvl('boots') >= 7) {
    P.auraT -= dt;
    if (P.auraT <= 0) { P.auraT = 0.2;
      for (const e of enemies) if ((e.x-P.x)**2 + (e.y-P.y)**2 < (36 + e.r)**2) damageEnemy(e, 20, (e.x-P.x)*3, (e.y-P.y)*3); }
  }
  // 수호자 / 수비자
  orbs = [];
  const gs = guardianSpec();
  if (gs.n > 0) {
    P.orbAngle += dt * gs.spd;
    for (let i = 0; i < gs.n; i++) {
      const a = P.orbAngle + i * Math.PI * 2 / gs.n;
      orbs.push({ x:P.x + Math.cos(a)*gs.rad, y:P.y + Math.sin(a)*gs.rad, r:gs.r, gear:gs.gear, rot:a*2 });
      if (gs.gear) particles.push({ x:orbs[orbs.length-1].x, y:orbs[orbs.length-1].y, vx:rand(-40,40), vy:rand(-40,40), t:0.3, c:'#ef4444' });
    }
    for (const e of enemies) {
      e.gHit -= dt;
      if (e.gHit > 0) continue;
      for (const o of orbs) if (dist2(o, e) < (o.r + e.r)**2) {
        damageEnemy(e, gs.dmg, (e.x-P.x)*2, (e.y-P.y)*2); e.gHit = gs.cd; break;
      }
    }
  }
  // 드론
  drones = [];
  const dn = droneCount();
  if (dn > 0) {
    const dl = lvl('drone'), evo = dl >= 7;
    for (let i = 0; i < dn; i++) {
      const a = time*1.5 + i * Math.PI * 2 / dn;
      const d = { x:P.x + Math.cos(a)*55, y:P.y + Math.sin(a)*55 - 10 };
      drones.push(d);
      P.dcd[i] = (P.dcd[i] ?? 0) - dt;
      if (P.dcd[i] <= 0) {
        const t = nearest(d, enemies, 480);
        if (t) {
          const base = Math.atan2(t.y - d.y, t.x - d.x), shots = evo ? 3 : 1 + Math.floor(dl / 2);
          for (let k = 0; k < shots; k++) {
            const ang = base + (k - (shots-1)/2) * 0.14;
            projs.push({ kind:'bolt', x:d.x, y:d.y, vx:Math.cos(ang)*620, vy:Math.sin(ang)*620, a:ang,
              dmg:evo ? 40 : 9 + dl*3, life:0.9, pierce:evo ? 3 : 0, hit:new Set(), r:evo ? 9 : 4 + dl*0.9, evo });
          }
          P.dcd[i] = (evo ? 0.2 : Math.max(0.2, 0.75 - 0.09*dl)) * cm;
        }
      }
    }
  }
  // 시간 정지
  if (P.freeze > 0) P.freeze -= dt;
  if (lvl('clock') >= 7) {
    P.freezeCd -= dt;
    if (P.freezeCd <= 0) { P.freezeCd = 20; P.freeze = 2.5; banner = 1.5; bannerTxt = '시간 정지!'; }
  }
}

function updateProjs(dt) {
  for (const p of projs) {
    if (p.kind === 'kunai' || p.kind === 'bolt') {
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
      if (p.evo) particles.push({ x:p.x, y:p.y, vx:0, vy:0, t:0.25, c:p.kind === 'bolt' ? '#f6f' : '#fa8' });
      for (const e of enemies) {
        if (e.hp <= 0 || p.hit.has(e)) continue;
        if (dist2(p, e) < (p.r + e.r)**2) {
          damageEnemy(e, p.dmg, p.vx*0.05, p.vy*0.05); p.hit.add(e);
          if (p.pierce-- <= 0) { p.life = 0; break; }
        }
      }
    } else if (p.kind === 'shuriken') {
      p.t += dt; p.spin += dt * 20;
      const d = p.R * Math.sin(Math.PI * Math.min(1, p.t / p.T));
      const ang = p.a + (p.orbit ? p.t * 3.4 : 0);   // 만렙: 나가고 들어오면서 플레이어 주위를 공전
      p.x = P.x + Math.cos(ang) * d; p.y = P.y + Math.sin(ang) * d;
      if (p.t >= p.T) p.life = 0;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        const last = p.hit.get(e);
        if ((last === undefined || time - last > 0.35) && dist2(p, e) < (p.r + e.r)**2) {
          damageEnemy(e, p.dmg, Math.cos(p.a)*60, Math.sin(p.a)*60); p.hit.set(e, time);
        }
      }
    } else if (p.kind === 'ball') {
      p.t += dt; p.life -= dt;
      if (!p.target || p.target.hp <= 0) {
        p.target = nearest(p, enemies.filter(e => e !== p.last && e.hp > 0), 380);
        if (!p.target) { p.life = 0; continue; }
      }
      const dx = p.target.x - p.x, dy = p.target.y - p.y, d = Math.hypot(dx, dy) || 1;
      p.x += dx/d*p.spd*dt; p.y += dy/d*p.spd*dt;
      p.a = Math.atan2(dy, dx);
      if (p.evo) for (let i = 0; i < 6; i++) {   // 불꽃 슈팅: 진행 방향의 반대쪽으로 픽셀 불꽃
        const back = p.a + Math.PI + rand(-0.45, 0.45), v = rand(80, 300);
        particles.push({ s:rand(2.5, 7), x:p.x - dx/d*p.r*0.8 + rand(-8,8), y:p.y - dy/d*p.r*0.8 + rand(-8,8), vx:Math.cos(back)*v, vy:Math.sin(back)*v, t:rand(0.2, 0.4), c:['#ef4444','#fb923c','#fde047'][i % 3] });
      } else particles.push({ x:p.x, y:p.y, vx:0, vy:0, t:0.2, c:'#fff' });
      if (d < p.r + p.target.r + 4) {
        const e = p.target;
        damageEnemy(e, p.dmg, dx/d*160, dy/d*160);
        if (p.evo) explode(e.x, e.y, 70, 60, '#fb923c');
        for (let i = 0; i < 4; i++) particles.push({ x:e.x, y:e.y, vx:rand(-120,120), vy:rand(-120,120), t:0.25, c:'#fff' });
        p.last = e; p.target = null; p.bounces--;
        if (p.bounces < 0) p.life = 0;
      }
    } else if (p.kind === 'brick') {
      p.t += dt; const k = Math.max(0, Math.min(1, p.t / p.dur));
      p.h = (1 - k) * p.h0;
      if (k >= 1) {
        const evo = p.lv >= 7;
        explode(p.tx, p.ty, evo ? 115 : 40 + p.lv*5, evo ? 220 : 35 + p.lv*14, '#d9a066');
        if (evo) { particles.push({ x:p.tx, y:p.ty, ring:160, t:0.4, tmax:0.4, c:'#fff' }); for (let i = 0; i < 10; i++) particles.push({ x:p.tx, y:p.ty, vx:rand(-220,220), vy:rand(-220,-40), t:0.5, c:'#9aa3b2' }); }
        for (let i = 0; i < 6; i++) particles.push({ x:p.tx, y:p.ty, vx:rand(-120,120), vy:rand(-160,-40), t:0.4, c:'#c9633d' });
        p.life = 0;
      }
    } else if (p.kind === 'molotov') {
      p.t += dt; const k = Math.min(1, p.t / p.dur);
      p.x = p.sx + (p.tx - p.sx)*k; p.y = p.sy + (p.ty - p.sy)*k - Math.sin(k*Math.PI)*60;
      if (k >= 1) {
        const evo = p.lv >= 7;
        pools.push({ x:p.tx, y:p.ty, r:evo ? 210 : 70 + p.lv*12, t:evo ? 5 : 3, tick:0, dmg:evo ? 60 : 12 + p.lv*6, blue:evo });
        p.life = 0;
      }
    } else if (p.kind === 'rocket') {
      if (!p.target || p.target.hp <= 0) p.target = nearest(p, enemies);
      if (p.target) {
        const want = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        let d = want - p.a; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI;
        p.a += Math.max(-4*dt, Math.min(4*dt, d));
      }
      p.spd = Math.min(420, p.spd + 250*dt);
      p.x += Math.cos(p.a)*p.spd*dt; p.y += Math.sin(p.a)*p.spd*dt; p.life -= dt;
      particles.push({ x:p.x, y:p.y, vx:0, vy:0, t:0.25, c:p.lv >= 7 ? '#fb923c' : '#999' });
      let boom = p.life <= 0;
      for (const e of enemies) if (e.hp > 0 && dist2(p, e) < (p.r + e.r)**2) { boom = true; break; }
      if (boom) {
        if (p.lv >= 7) {
          explode(p.x, p.y, 140, 180);
          for (let i = 0; i < 3; i++) explode(p.x + rand(-110,110), p.y + rand(-110,110), 70, 70);
        } else explode(p.x, p.y, 70 + p.lv*10, 50 + p.lv*20);
        p.life = 0;
      }
    }
  }
  projs = projs.filter(p => (p.life === undefined) || p.life > 0);
  for (const f of pools) {
    f.t -= dt; f.tick -= dt;
    if (f.tick <= 0) {
      f.tick = 0.3;
      for (const e of enemies) if ((e.x-f.x)**2 + (e.y-f.y)**2 < (f.r + e.r)**2) damageEnemy(e, f.dmg);
    }
  }
  pools = pools.filter(f => f.t > 0);
}

// ---------- 갱신 ----------
function update(dt) {
  time += dt;
  P.bonusT = (P.bonusT || 0) + dt;                       // 생존 보너스: 20초마다 +1골드 (즉시 저장)
  if (P.bonusT >= 20) { P.bonusT -= 20; P.bonusGold = (P.bonusGold || 0) + 1; SAVE.gold++; persist(); }

  let dx = (keys['d']||keys['arrowright']?1:0) - (keys['a']||keys['arrowleft']?1:0);
  let dy = (keys['s']||keys['arrowdown']?1:0) - (keys['w']||keys['arrowup']?1:0);
  if (touchStick) { const vx = touchStick.x - touchStick.sx, vy = touchStick.y - touchStick.sy, d = Math.hypot(vx, vy); if (d > 8) { dx = vx / d; dy = vy / d; } }
  const m = Math.hypot(dx, dy);
  P.moving = m > 0;
  if (m) { dx /= m; dy /= m; P.x += dx*speedOf()*dt; P.y += dy*speedOf()*dt; if (dx) P.face = dx > 0 ? 1 : -1; }
  P.hurtT -= dt; P.inv -= dt;
  if (lvl('boots') >= 7) { P.trailT -= dt; if (P.trailT <= 0) { P.trailT = 0.04; P.trail.unshift({ x:P.x, y:P.y, face:P.face }); if (P.trail.length > 16) P.trail.pop(); } } else P.trail.length = 0;
  if (lvl('heart') >= 7 && Math.random() < dt * 3) particles.push({ x:P.x + rand(-22,22), y:P.y, vx:0, vy:-45, t:0.8, c:'#ff7ab0' });
  if (lvl('heart') >= 7) P.hp = Math.min(P.maxHp, P.hp + 5*dt);
  cam.x += (P.x - cam.x) * Math.min(1, dt*8); cam.y += (P.y - cam.y) * Math.min(1, dt*8);
  if (banner > 0) banner -= dt;

  director(dt);
  updateWeapons(dt);
  updateProjs(dt);
  const frozen = P.freeze > 0;

  // 적 이동·충돌
  for (const e of enemies) {
    const d = Math.hypot(P.x - e.x, P.y - e.y) || 1;
    e.flash -= dt; e.hitCd -= dt;
    if (!frozen) {
      const dashing = e.boss ? bossAI(e, dt) : false;
      if (!dashing) { const slow = lvl('shield') && d < shieldR() + e.r ? 1 - shieldSlow() : 1;
        const mv = (e.ranged && d < 260 ? 0 : 1) * slow * (1 - clockSlow()); e.x += (P.x - e.x)/d * e.speed * dt * mv; e.y += (P.y - e.y)/d * e.speed * dt * mv; }
      if (e.ranged) { e.fireT -= dt * (lvl('shield') && d < shieldR() + e.r ? 1 - shieldSlow() : 1) * (1 - clockSlow());   // 방어막 안에서는 발사도 느려짐
        if (e.fireT <= 0 && d < 520) { e.fireT = 5.5; ebullets.push({ x:e.x, y:e.y, vx:(P.x-e.x)/d*230, vy:(P.y-e.y)/d*230, life:4, r:8, dmg:e.dmg, green:true }); } }
    }
    e.x += e.kx * dt; e.y += e.ky * dt;
    e.kx *= Math.pow(0.02, dt); e.ky *= Math.pow(0.02, dt);
    if (!frozen && e.hp > 0 && d < e.r + P.r && e.hitCd <= 0) {
      e.hitCd = 0.7;
      hurtPlayer(e.dmg);
    }
  }
  // 적끼리 겹침 완화
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.boss) continue;
    for (let j = i + 1; j < Math.min(enemies.length, i + 12); j++) {
      const b = enemies[j]; if (b.boss) continue;
      const ddx = b.x - a.x, ddy = b.y - a.y, min = (a.r + b.r) * 0.8, dd = ddx*ddx + ddy*ddy;
      if (dd < min*min && dd > 0.01) { const d = Math.sqrt(dd), push = (min - d) * 0.3;
        a.x -= ddx/d*push; a.y -= ddy/d*push; b.x += ddx/d*push; b.y += ddy/d*push; }
    }
  }
  for (const e of enemies) if (e.hp <= 0) killEnemy(e);
  enemies = enemies.filter(e => e.hp > 0);

  if (!frozen) for (const h of hazards) {            // 보스 예고 공격 (붉은 원) 폭발
    h.t -= dt;
    if (h.t <= 0) {
      h.done = true;
      if (dist2(h, P) < (h.r + P.r)**2) hurtPlayer(h.dmg);
      particles.push({ x:h.x, y:h.y, ring:h.r, t:0.35, tmax:0.35, c:'#f66' });
      for (let i = 0; i < 6; i++) particles.push({ x:h.x, y:h.y, vx:rand(-160,160), vy:rand(-160,160), t:0.35, c:'#fa8' });
    }
  }
  hazards = hazards.filter(h => !h.done);
  // 적 탄환
  for (const b of ebullets) {
    const bs = lvl('shield') && dist2(b, P) < shieldR()**2 ? 1 - shieldSlow() : 1;   // 방어막 안 탄환 둔화
    b.x += b.vx*dt*bs; b.y += b.vy*dt*bs; b.life -= dt;
    if (dist2(b, P) < (b.r + P.r)**2) { b.life = 0; hurtPlayer(b.dmg || 10); }
  }
  ebullets = ebullets.filter(b => b.life > 0);

  // 보석
  const magnet = ((80 + P.level * 2) * (lvl('magnet') >= 7 ? 5 : 1 + 0.25 * lvl('magnet'))) + (lvl('scroll') >= 7 ? 320 : 0);   // 비전서 + 자석 범위가 합산
  for (const g of gems) {
    const d = Math.hypot(P.x - g.x, P.y - g.y) || 1;
    if (d < magnet || g.pull) { g.pull = true; g.x += (P.x-g.x)/d * 420 * dt; g.y += (P.y-g.y)/d * 420 * dt; }
    if (d < P.r + 6) { g.dead = true; gainXp(g.v * (g.magX || 1)); }
  }
  gems = gems.filter(g => !g.dead);

  // 아이템
  for (const it of items) if (it.kind === 'coin') {                 // 코인은 가까이 가면 끌려옴
    const d = Math.hypot(P.x - it.x, P.y - it.y) || 1;
    if (d < magnet * 0.7 || it.pull) { it.pull = true; it.x += (P.x - it.x)/d * 460 * dt; it.y += (P.y - it.y)/d * 460 * dt; }
  }
  for (const it of items) if (dist2(P, it) < (P.r + 16)**2) {
    it.dead = true;
    if (it.kind === 'meat') { P.hp = Math.min(P.maxHp, P.hp + 30); floaters.push({ x:P.x, y:P.y - 20, txt:'+30', t:0.8 }); }
    else if (it.kind === 'magnet') { const bonus = lvl('scroll') >= 7, mb = magnetXpBonus(), mulX = (bonus ? 3 : 1) * (1 + mb); for (const g of gems) { g.pull = true; if (mulX > 1) g.magX = mulX; }
      const parts = []; if (mb > 0) parts.push('자석 +' + Math.round(mb * 100) + '%'); if (bonus) parts.push('비전서 x3'); if (parts.length) floaters.push({ x:P.x, y:P.y - 40, txt:'경험치 ' + parts.join(' · '), t:1.2, gold:true }); for (const i of items) if (i.kind === 'coin') i.pull = true; }
    else if (it.kind === 'coin') { P.gold += it.v; SAVE.gold += it.v; persist(); floaters.push({ x:P.x, y:P.y - 24, txt:'+' + it.v, t:0.7, gold:true }); }
    else if (it.kind === 'chest') P.pending++;
  }
  items = items.filter(i => !i.dead);

  if (P.pending > 0 && state === 'play') { P.pending--; openLevelUp(); }

  for (const b of bolts) b.t -= dt;
  bolts = bolts.filter(b => b.t > 0);
  for (const f of floaters) { f.t -= dt; f.y -= 30*dt; }
  floaters = floaters.filter(f => f.t > 0);
  for (const p of particles) { p.t -= dt; if (p.vx) { p.x += p.vx*dt; p.y += p.vy*dt; } }
  particles = particles.filter(p => p.t > 0);
}

// ---------- 그리기 ----------
function emoji(ch, x, y, size, flip, rot = 0) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (flip) ctx.scale(-1, 1);
  ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, 0, 0); ctx.restore();
}
function bar(x, y, w, h, frac, col, bg = '#0008') {
  ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w*Math.max(0, Math.min(1, frac)), h);
}
function star(x, y, r, rot, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = col; ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const rr = i % 2 ? r*0.35 : r, a = i * Math.PI / 4; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}

// ---------- 벡터 아이콘 ----------
// 모든 아이콘은 -1~1 단위 좌표계로 그린다 (icon()이 크기에 맞게 스케일)
const OUT = '#12161d';
function sh(fill, fn, lw = 0.13) {
  ctx.beginPath(); fn();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
}
const poly = pts => pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
const circ = (x, y, r) => { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); };
const ell = (x, y, rx, ry, rot = 0) => { ctx.moveTo(x + rx*Math.cos(rot), y + rx*Math.sin(rot)); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); };
function ln(x1, y1, x2, y2, col, lw) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function starPts(n, R, r, rot = 0) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n - Math.PI / 2, rr = i % 2 ? r : R; pts.push([Math.cos(a)*rr, Math.sin(a)*rr]); }
  return pts;
}
function flameShape(outer, inner) {
  const path = k => { ctx.moveTo(0, -1*k); ctx.bezierCurveTo(.2*k, -.5*k, .8*k, -.2*k, .7*k, .4*k);
    ctx.bezierCurveTo(.6*k, .9*k, -.6*k, .9*k, -.7*k, .4*k); ctx.bezierCurveTo(-.8*k, -.1*k, -.2*k, -.3*k, 0, -1*k); };
  sh(outer, () => path(1));
  ctx.save(); ctx.translate(0, .25); sh(inner, () => path(.55), 0.0001); ctx.restore();
}
function kun() {
  sh('#e8eef6', () => poly([[0,-1],[.3,-.2],[.13,.1],[-.13,.1],[-.3,-.2]]), .22);
  ln(0, -.85, 0, .02, '#8fa0b5', .07);
  sh('#8a2f2f', () => poly([[-.11,.1],[.11,.1],[.11,.62],[-.11,.62]]), .2);
  ln(-.11, .25, .11, .2, '#f0c4c4', .05); ln(-.11, .42, .11, .37, '#f0c4c4', .05);
  sh(null, () => circ(0, .8, .2), .2);
}
function gearShape(rim, ring) {
  sh(rim, () => { const pts = [];
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4;
      [[-.2,.78],[-.12,1],[.12,1],[.2,.78]].forEach(([da, r]) => pts.push([Math.cos(a+da)*r, Math.sin(a+da)*r])); }
    poly(pts); });
  sh(ring, () => circ(0, 0, .62));
  sh('#2a303b', () => circ(0, 0, .28));
}
function shieldPath(k) {
  ctx.moveTo(-.75*k, -.8*k); ctx.lineTo(.75*k, -.8*k); ctx.lineTo(.75*k, 0);
  ctx.quadraticCurveTo(.75*k, .65*k, 0, 1*k); ctx.quadraticCurveTo(-.75*k, .65*k, -.75*k, 0); ctx.closePath();
}
function heartPath() {
  ctx.moveTo(0, .85); ctx.bezierCurveTo(-1.2, 0, -.8, -.9, 0, -.4); ctx.bezierCurveTo(.8, -.9, 1.2, 0, 0, .85);
}
function wing(dir) {
  ctx.save(); ctx.scale(dir, 1);
  sh('#f8fafc', () => poly([[.45,-.1],[1,-.8],[1,-.3],[1.1,0],[.9,.2],[.45,.3]]));
  ln(.55, -.05, .95, -.5, '#cbd5e1', .05);
  ctx.restore();
}

  kb.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0.01;font-size:16px;border:0;padding:0';
  kb.setAttribute('autocapitalize', 'off'); kb.setAttribute('autocomplete', 'off'); kb.setAttribute('autocorrect', 'off');
  document.body.appendChild(kb);
  kb.addEventListener('input', () => {
    if (state !== 'auth' || AUTH.busy) return;
    const fk = authFields()[AUTH.focus] || 'name';
    const v = fk === 'name' ? kb.value.replace(/[^A-Za-z0-9_]/g, '').slice(0, 16) : kb.value.slice(0, 32);
    AUTH[fk] = v; kb.value = v;
  });
}
function focusKb() {
  if (!kb || MODE !== 'mobile') return;
  const fk = authFields()[AUTH.focus] || 'name';
  kb.type = fk === 'name' ? 'text' : 'password'; kb.value = AUTH[fk]; kb.focus();
}
function authFields() { return AUTH.mode === 'delete' ? ['pw'] : AUTH.mode === 'login' ? ['name', 'pw'] : ['name', 'pw', 'pw2']; }
function authKey(e) {
  if (AUTH.busy) return;
  if (kb && document.activeElement === kb && !['Enter', 'Escape', 'Tab'].includes(e.key)) return;   // 숨은 입력창이 처리
  const fs2 = authFields(), fld = fs2[AUTH.focus] || 'name';
  if (e.key === 'Escape') { state = 'title'; return; }
  if (e.key === 'Tab') { e.preventDefault(); AUTH.focus = (AUTH.focus + (e.shiftKey ? fs2.length - 1 : 1)) % fs2.length; return; }
  if (e.key === 'Enter') { if (AUTH.focus < fs2.length - 1) { AUTH.focus++; focusKb(); } else authSubmit(); return; }
  if (e.key === 'Backspace') { e.preventDefault(); AUTH[fld] = AUTH[fld].slice(0, -1); return; }
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
    if (fld === 'name') { if (/[A-Za-z0-9_]/.test(e.key) && AUTH.name.length < 16) AUTH.name += e.key; }
    else if (AUTH[fld].length < 32) AUTH[fld] += e.key;
  }
}
async function authSubmit() {
  if (AUTH.busy) return;
  AUTH.busy = true; AUTH.msg = '처리 중…';
  let err;
  try { err = AUTH.mode === 'delete' ? await deleteAccount(AUTH.pw) : AUTH.mode === 'login' ? await logIn(AUTH.name, AUTH.pw) : await signUp(AUTH.name, AUTH.pw, AUTH.pw2); } catch (e) { err = '오류가 발생했습니다'; }
  AUTH.busy = false;
  if (err) { AUTH.msg = err; return; }
  state = 'title'; AUTH.pw = AUTH.pw2 = '';
}
function drawAuth() {
  ctx.fillStyle = '#1b2a3a'; ctx.fillRect(0, 0, W, H);
  const signup = AUTH.mode === 'signup', del = AUTH.mode === 'delete', cw = Math.min(420, W - 30), x = W/2 - cw/2, fl = authFields();
  const ch = 150 + fl.length * 74 + 170, y = Math.max(10, H/2 - ch/2);
  ctx.fillStyle = '#26384f'; ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x - 20, y, cw + 40, ch, 14); ctx.fill(); ctx.stroke();
  text(del ? '계정 삭제' : signup ? '계정 만들기' : '로그인', W/2, y + 52, 34, del ? '#ff8a80' : '#ffd54a');
  if (del) text('골드·상점 구매 등 이 계정의 모든 기록이 사라집니다', W/2, y + 78, 13, '#ffb4a8');
  const labels = { name:'아이디 (영문·숫자·_ 2~16자)', pw:del ? '비밀번호 확인 (삭제하려면 입력)' : '비밀번호 (4자 이상)', pw2:'비밀번호 확인' };
  fl.forEach((fk, i) => {
    const fy = y + 98 + i * 74, on = AUTH.focus === i;
    text(labels[fk], x, fy - 8, 13, '#9fb3c8', 'left');
    ctx.fillStyle = '#0d1824'; ctx.strokeStyle = on ? '#ffd54a' : '#556'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x, fy, cw, 40, 8); ctx.fill(); ctx.stroke();
    const v = fk === 'name' || AUTH.show ? AUTH[fk] : '•'.repeat(AUTH[fk].length);
    text(v + (on && Math.floor(performance.now() / 500) % 2 === 0 ? '|' : ''), x + 12, fy + 27, 18, '#fff', 'left');
    btns.push({ x, y:fy, w:cw, h:40, fn:() => { AUTH.focus = i; focusKb(); } });
  });
  const by = y + 98 + fl.length * 74 - 10;
  button(AUTH.show ? '비밀번호 숨기기' : '비밀번호 보기', x, by, 150, 30, () => { AUTH.show = !AUTH.show; }, '#475569');
  if (AUTH.msg) text(AUTH.msg, W/2, by + 54, 15, AUTH.busy ? '#ccc' : '#ff8a80');
  button(del ? '계정 삭제 [Enter]' : signup ? '가입하기 [Enter]' : '로그인 [Enter]', x, by + 70, cw, 44, authSubmit, del ? '#c0392b' : '#2f9e5b');
  if (!del) button(signup ? '이미 계정이 있어요 → 로그인' : '계정이 없어요 → 가입', x, by + 124, cw, 38, () => openAuth(signup ? 'login' : 'signup'), '#475569');
  button('돌아가기 [Esc]', x, by + 172, cw, 38, () => { state = 'title'; }, '#7a2e2e');
  if (signup) text('아이디·비밀번호는 이 브라우저에만 저장됩니다 (서버 없음)', W/2, y + ch - 12, 12, '#9fb3c8');
}
function drawPause() {
  ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
  text('일시정지', W/2, H/2 - 70, 46, '#ffd54a');
  text('골드는 획득 즉시 저장됩니다', W/2, H/2 - 30, 15, '#ccc');
  button('계속하기 [Esc]', W/2 - 170, H/2, 160, 48, () => { state = 'play'; }, '#2f9e5b');
  button('스킬 도감', W/2 - 170, H/2 + 62, 160, 40, openCodex, '#7a4fd6');
  button('적 도감', W/2 + 10, H/2 + 62, 160, 40, openBest, '#b04a4a');
  button('나가기', W/2 + 10, H/2, 160, 48, () => { endRun(); state = 'title'; }, '#c0392b');
}
function drawWin() {
  ctx.fillStyle = '#000c'; ctx.fillRect(0, 0, W, H);
  text('VICTORY!', W/2, H/2 - 90, 60, '#ffd54a');
  text('죽음의 군주를 쓰러뜨렸습니다!', W/2, H/2 - 50, 22, '#fff');
  const m = Math.floor(time/60), s = Math.floor(time%60);
  text('생존 ' + m + '분 ' + s + '초  ·  처치 ' + kills + '  ·  Lv.' + P.level, W/2, H/2 - 14, 20);
  icon('coin', W/2 - 90, H/2 + 24, 24); text('+' + (P.earned || 0) + ' 골드 (클리어 보너스 +1000 포함)', W/2 - 72, H/2 + 32, 18, '#ffd54a', 'left');
  text('보유 골드 ' + SAVE.gold, W/2, H/2 + 62, 15, '#ccc');
  button('시작 화면으로 [Esc]', W/2 - 170, H/2 + 90, 340, 48, () => { state = 'title'; }, '#2f6fdd');
  button('다시 시작 [R]', W/2 - 170, H/2 + 150, 160, 46, start, '#2f9e5b');
  button('상점 [S]', W/2 + 10, H/2 + 150, 160, 46, openShop, '#e0932b');
}
function drawOver() {
  ctx.fillStyle = '#000c'; ctx.fillRect(0, 0, W, H);
  text('GAME OVER', W/2, H/2 - 50, 56, '#f55');
  const m = Math.floor(time/60), s = Math.floor(time%60);
  text(`생존 ${m}분 ${s}초  ·  처치 ${kills}  ·  Lv.${P.level}`, W/2, H/2, 22);
  icon('coin', W/2 - 70, H/2 + 42, 24); text('+' + (P.earned || 0) + ' 골드', W/2 - 52, H/2 + 50, 20, '#ffd54a', 'left');
  text(`보유 골드 ${SAVE.gold}`, W/2, H/2 + 82, 15, '#ccc');
  if (canPayRevive()) button('부활 [V]  (' + REVIVE_COST + ' 골드)', W/2 - 170, H/2 + 165, 340, 46, reviveWithGold, '#7a4fd6');
  button('다시 시작 [R]', W/2 - 170, H/2 + 105, 160, 46, start, '#2f9e5b');
  button('상점 [S]', W/2 + 10, H/2 + 105, 160, 46, openShop, '#e0932b');
  button('시작 화면으로 [Esc]', W/2 - 170, H/2 + (canPayRevive() ? 225 : 165), 340, 46, () => { state = 'title'; }, '#475569');
}

function drawTitle() {
  ctx.fillStyle = '#1b261b'; ctx.fillRect(0, 0, W, H);
  text('탕탕', W/2, H/2 - 70, 80, '#ffd54a');
  text('몰려오는 적을 처치하고 끝까지 살아남아라!', W/2, H/2 - 20, 20);
  text(MODE === 'mobile' ? '화면에 손가락을 대고 드래그한 방향으로 이동 · 무기는 자동 발사' : 'WASD / 방향키로 이동 · 무기는 자동 발사', W/2, H/2 + 20, 16, '#ccc');
  text('조작 방식', 20, 30, 14, '#ffffffaa', 'left');
  button('PC', 20, 40, 80, 40, () => setMode('pc'), MODE === 'pc' ? '#e0932b' : '#475569');
  button('모바일', 106, 40, 90, 40, () => setMode('mobile'), MODE === 'mobile' ? '#e0932b' : '#475569');
  icon('coin', W/2 - 56, H/2 + 56, 22); text(String(SAVE.gold), W/2 - 40, H/2 + 63, 20, '#ffd54a', 'left');
  button('시작 [Enter]', W/2 - 170, H/2 + 85, 160, 48, start, '#2f9e5b');
  button('상점 [S]', W/2 + 10, H/2 + 85, 160, 48, openShop, '#e0932b');
  icon(charIcon(), W/2, H/2 + 225, 64);
  text('v' + VERSION, 14, H - 16, 14, '#ffffffaa', 'left');
  button('스킬 도감 [C]', W/2 - 170, H/2 + 145, 160, 40, openCodex, '#7a4fd6');
  button('적 도감 [E]', W/2 + 10, H/2 + 145, 160, 40, openBest, '#b04a4a');
  if (ACCOUNT) {
    text('계정: ' + (readAccounts()[ACCOUNT] || {}).name, W - 20, 36, 16, '#9fe29f', 'right');
    button('로그아웃', W - 130, 48, 110, 34, () => { logOut(); }, '#7a2e2e');
    button('계정 삭제', W - 130, 88, 110, 30, () => openAuth('delete'), '#5a1f1f');
  } else button('로그인 / 가입', W - 190, 20, 170, 40, () => openAuth('login'), '#2f6fdd');
  button('버전 기록', W - 190, H - 56, 170, 40, () => { state = 'changelog'; clScroll = 0; }, '#475569');
}

// ---------- 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  btns = [];
  if (state !== 'play') touchStick = null;
  if (state !== 'auth' && kb && document.activeElement === kb) kb.blur();
  if (state === 'info' && infoFrom === 'codex') { drawCodex(); btns = []; drawInfo(); } else
  if (state === 'title') drawTitle();
  else if (state === 'shop') drawShop();
  else if (state === 'changelog') drawChangelog();
  else if (state === 'codex') drawCodex();
  else if (state === 'bestiary') drawBestiary();
  else if (state === 'auth') drawAuth();
  else {
    if (state === 'play') update(dt);
    drawWorld(); drawHUD();
    if (state === 'levelup') drawLevelUp();
    if (state === 'over') drawOver();
    if (state === 'win') drawWin();
    if (state === 'pause') drawPause();
    if (state === 'info') drawInfo();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
