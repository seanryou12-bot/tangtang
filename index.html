<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>탕탕 - Survivor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if (state === 'levelup' && ['1','2','3'].includes(k)) pick(+k - 1);
  if ((state === 'over' || state === 'win') && (k === 'r' || k === 'enter')) start();
  if (state === 'title' && (k === 'enter' || k === ' ')) start();
  if ((state === 'title' || state === 'over' || state === 'win') && k === 's') openShop();
  if (state === 'shop' && (k === 'escape' || k === 'backspace')) closeShop();
  if (state === 'shop' && (k === '1' || k === '2' || k === '3')) { shopTab = +k - 1; shopScroll = 0; }
  if (state === 'shop' && (k === 'arrowdown' || k === 'pagedown')) shopScroll = Math.min(shopMax, shopScroll + 80);
  if (state === 'shop' && (k === 'arrowup' || k === 'pageup')) shopScroll = Math.max(0, shopScroll - 80);
  if (k === 'escape' && state === 'info') state = infoFrom;
  else if (k === 'escape' && state === 'play') state = 'pause';
  else if (k === 'escape' && state === 'pause') state = 'play';
  if (state === 'over' && k === 'v') reviveWithGold();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
let mouse = {x:0,y:0};
cv.addEventListener('wheel', e => { if (state === 'shop') { shopScroll = Math.max(0, Math.min(shopMax, shopScroll + e.deltaY)); e.preventDefault(); } }, { passive:false });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('click', e => {
  if (state === 'levelup') {
    cardRects.forEach((r,i) => { if (e.clientX>=r.x && e.clientX<=r.x+r.w && e.clientY>=r.y && e.clientY<=r.y+r.h) pick(i); });
  } else if (state === 'info') {
    state = infoFrom;
  } else if (state === 'play' || state === 'pause') {
    const h = hudRects.find(r => e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h);
    if (h) { infoKey = h.k; infoFrom = state; state = 'info'; }
    else if (state === 'pause') for (const b of btns) if (e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h && (b.y0 === undefined || (e.clientY >= b.y0 && e.clientY <= b.y1))) { b.fn(); break; }
  } else if (state === 'over' || state === 'win' || state === 'title' || state === 'shop') {
    for (const b of btns) if (e.clientX >= b.x && e.clientX <= b.x + b.w && e.clientY >= b.y && e.clientY <= b.y + b.h && (b.y0 === undefined || (e.clientY >= b.y0 && e.clientY <= b.y1))) { b.fn(); break; }
  }
});

// ---------- 유틸 ----------
const rand = (a,b) => a + Math.random()*(b-a);
const dist2 = (a,b) => (a.x-b.x)**2 + (a.y-b.y)**2;
function nearest(from, list, maxD = Infinity) {
  let best = null, bd = maxD*maxD;
  for (const e of list) { const d = dist2(from, e); if (d < bd) { bd = d; best = e; } }
  return best;
}

// ---------- 저장 데이터 (골드/상점) ----------
const SAVE_KEY = 'tangtang_save_v1';
let SAVE = { gold:0, up:{}, aff:{}, chars:{ ninja:true }, char:'ninja' };
function loadSave() { try { const j = JSON.parse(localStorage.getItem(SAVE_KEY)); if (j) SAVE = Object.assign(SAVE, j); } catch (e) {} SAVE.up = SAVE.up || {}; SAVE.aff = SAVE.aff || {}; SAVE.chars = SAVE.chars || { ninja:true }; SAVE.char = SAVE.char || 'ninja'; }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
loadSave();
const upLv = id => SAVE.up[id] || 0;

// ---------- 정의 ----------
// 1~6레벨: 수치 강화 / 7레벨(MAX): 형태가 바뀌는 진화
const MAXLV = 7;
const UPGRADES = {
  kunai:    { name:'쿠나이',     icon:'kunai', desc: l => l===0 ? '가장 가까운 적에게 쿠나이를 던진다' : '쿠나이 개수·공격속도·데미지 증가',
              evo:{ name:'쿠나이 난무', icon:'kunaiEvo', desc:'사방 12방향으로 관통 쿠나이를 흩뿌린다' } },
  shuriken: { name:'수리검',     icon:'shuriken', desc: l => l===0 ? '날아갔다가 돌아오는 관통 수리검' : '레벨마다 수리검 +1개(최대 6개), 사거리·크기·피해 증가',
              evo:{ name:'풍마 수리검', icon:'shurikenEvo', desc:'거대 수리검 6개가 플레이어 주변을 공전하며 나갔다 돌아온다' } },
  shield:   { name:'방어막',     icon:'shield', desc: l => l===0 ? '주변에 방어막 필드 생성: 안의 적은 느려지고 피해를 입으며, 받는 피해 50% 감소' : '방어막 범위(크게)·적 둔화·피해 증가',
              evo:{ name:'가시 방어막', icon:'shieldEvo', desc:'거대한 방어막, 적을 크게 둔화시키고 안의 적에게 가시 피해' } },
  guardian: { name:'수호자',     icon:'gear', desc: l => l===0 ? '플레이어 주위를 도는 톱니바퀴 수호자 1개' : '수호자 +1, 회전속도·크기·피해 증가',
              evo:{ name:'수비자',     icon:'sawblade', desc:'붉은 원형 칼날 6개가 훨씬 빠르게 회전한다' } },
  molotov:  { name:'화염병',     icon:'molotov', desc: l => l===0 ? '적에게 던져 불바다를 만든다' : '범위·데미지 증가, 쿨타임 감소',
              evo:{ name:'기름통',     icon:'oilbarrel', desc:'기름통 3개를 던져 푸른 불꽃의 거대한 불바다를 만든다' } },
  rocket:   { name:'로켓',       icon:'rocket', desc: l => l===0 ? '적을 추적해 폭발하는 로켓 발사' : '레벨마다 로켓 +1발, 크기·폭발 범위·피해 증가',
              evo:{ name:'미사일 폭격', icon:'meteor', desc:'거대 로켓 7발, 거대한 연쇄 폭발' } },
  drone:    { name:'공격용 드론', icon:'drone', desc: l => l===0 ? '따라다니며 적을 자동 사격하는 드론' : '레벨마다 드론 +1기, 드론·탄 크기, 연사 속도, 발사 수 증가',
              evo:{ name:'레이저 드론', icon:'droneEvo', desc:'드론 6기가 관통탄을 연사한다' } },
  boots:    { name:'신발',       icon:'boots', desc: l => l===0 ? '이동속도 증가' : '이동속도 추가 증가',
              evo:{ name:'질풍 신발',   icon:'bootsEvo', desc:'이동속도 대폭 증가, 몸에 닿는 적에게 피해' } },
  scroll:   { name:'닌자 스크롤', icon:'scroll', desc: l => l===0 ? '경험치 획득량 +20%' : '경험치 획득량 +20% 추가',
              evo:{ name:'비전서',     icon:'book', desc:'경험치 3배, 보석 흡수 범위 대폭 증가' } },
  heart:    { name:'체력 증가',   icon:'heart', desc: l => l===0 ? '최대 체력 +100, 즉시 회복' : '최대 체력 +100 추가',
              evo:{ name:'불사의 심장', icon:'heartEvo', desc:'최대 체력 +200, 초당 2 재생, 사망 시 1회 부활' } },
  clock:    { name:'쿨타임 감소', icon:'stopwatch', desc: l => l===0 ? '모든 무기 쿨타임 -7%' : '쿨타임 추가 감소',
              evo:{ name:'시간 정지',   icon:'hourglass', desc:'쿨타임 -55%, 20초마다 적이 2.5초간 정지' } },
  lightning:{ name:'번개',       icon:'lightning', desc: l => l===0 ? '하늘에서 적에게 번개가 내리친다' : '번개 횟수·피해·범위 증가',
              evo:{ name:'뇌신의 심판', icon:'lightningEvo', desc:'번개 8줄기가 폭풍처럼 쏟아진다' } },
  summoner: { name:'소환자',     icon:'summon', desc: l => l===0 ? '유령 정령을 소환해 적을 공격한다' : '새 정령 +1 (개구리→슬라임→독수리→말 탄 기사→드래곤), 3레벨부터 범위 공격',
              evo:{ name:'소환왕',     icon:'summonEvo', desc:'6종 정령이 모두 강화되고 거대 골렘이 합류한다' } },
  laser:    { name:'레이저',     icon:'laser', desc: l => l===0 ? '모든 것을 꿰뚫는 레이저를 발사한다' : '레이저 굵기·피해 증가, 4레벨부터 2줄기',
              evo:{ name:'회전 레이저', icon:'laserEvo', desc:'4갈래 레이저가 회전하며 주변을 불태운다' } },
  brick:    { name:'벽돌',       icon:'brick', desc: l => l===0 ? '벽돌을 던져 적 위로 떨어뜨린다' : '벽돌 개수·범위·피해 증가',
              evo:{ name:'앤빌',       icon:'anvil', desc:'거대한 앤빌 4개가 떨어져 큰 충격파를 일으킨다' } },
  drill:    { name:'드릴샷',     icon:'drill', desc: l => l===0 ? '화면 벽을 튕기며 계속 돌아다니는 드릴 1개' : '드릴 +1개, 크기·피해 증가',
              evo:{ name:'메가 드릴',   icon:'drillEvo', desc:'거대 드릴 6개, 벽에 튕길 때마다 충격파가 터진다' } },
  magnet:   { name:'자석',       icon:'magnet', desc: l => l===0 ? '보석 흡수 범위 증가, 자석 아이템이 더 자주 드롭' : '흡수 범위·자석 드롭 확률 증가',
              evo:{ name:'초강력 자석', icon:'magnetEvo', desc:'보석 흡수 범위 대폭 증가, 자석 드롭이 매우 잦아진다' } },
  dmgup:    { name:'공격력 강화', icon:'powerup', desc: l => l===0 ? '모든 공격력 +5% (레벨 제한 없음)' : '모든 공격력 +5% 추가', evo:null },
  soccer:   { name:'축구공',     icon:'ball', desc: l => l===0 ? '적들 사이를 튕겨 다니는 축구공을 찬다' : '레벨마다 공 +1개, 공 크기·튕기는 횟수·피해 증가',
              evo:{ name:'불꽃 슈팅',   icon:'ballEvo', desc:'불타는 거대 축구공 3개가 15번씩 튕기며 폭발한다' } },
};
const WEAPON_KEYS = Object.keys(UPGRADES);
const powerLv = () => WEAPON_KEYS.reduce((a, k) => a + P.w[k], 0);
const maxedCount = () => WEAPON_KEYS.filter(k => k !== 'dmgup' && P.w[k] >= MAXLV).length;

const ENEMY_TYPES = {
  zombie: { icon:'zombie', hp:10, speed:48,  dmg:8,  r:15, size:32, gem:1 },
  dog:    { icon:'dog', hp:8,  speed:105, dmg:6,  r:13, size:28, gem:1 },
  bug:    { icon:'bug', hp:5,  speed:80,  dmg:4,  r:9,  size:20, gem:1 },
  brute:  { icon:'brute', hp:160,speed:38,  dmg:18, r:24, size:52, gem:6 },
  warlord:{ icon:'warlord', hp:1200, speed:46, dmg:40, r:36, size:84, gem:20 },
  colossus:{ icon:'colossus', hp:3500, speed:36, dmg:60, r:48, size:112, gem:40 },
  knight: { icon:'knight', hp:55,  speed:58,  dmg:14, r:17, size:38, gem:2 },
  wolf:   { icon:'wolf',   hp:40,  speed:135, dmg:16, r:15, size:34, gem:2 },
  spitter:{ icon:'spitter',hp:35,  speed:55,  dmg:10, r:15, size:36, gem:2, ranged:true },
  reaper: { icon:'reaper', hp:140, speed:150, dmg:28, r:17, size:44, gem:4 },
  titan:  { icon:'titan',  hp:380, speed:42,  dmg:30, r:30, size:72, gem:10 },
};
const BOSSES = [
  { name:'티라노 대왕', icon:'trex' }, { name:'거미 여왕', icon:'spider' }, { name:'드래곤', icon:'dragon' },
  { name:'외계 군주', icon:'alien' },   { name:'죽음의 군주', icon:'skull' },
];

// ---------- 상태 ----------
let state = 'title';
let hazards = [];
let P, items, enemies, gems, projs, pools, orbs = [], drones = [], ebullets, floaters, particles, minions = [], lasers = [], bolts = [], drillList = [];
let cam, time, kills, spawnT, bruteT, titanT, warlordT, colossusT, bossT, bossN, itemT, banner = 0, bannerTxt = '', lvChoices = [], cardRects = [];

function start() {
  P = { x:0, y:0, hp:100, maxHp:100, r:12, xp:0, level:1, need:5, face:1, hurtT:0, pending:0,
        w:Object.fromEntries(WEAPON_KEYS.map(k => [k, 0])),
        cd:{kunai:0, molotov:1, rocket:1, shuriken:1.5, lightning:2, laser:3, brick:2, soccer:1.5}, dcd:[], shieldCharges:0, shieldT:0, orbAngle:0,
        auraT:0, spikeT:0, freeze:0, freezeCd:12, revived:false };
  P.w[curChar().start] = 1; P.trail = []; P.trailT = 0;
  P.maxHp = calcMaxHp(); P.hp = P.maxHp; P.gold = 0; P.ended = false; P.extraRevive = upLv('revive') > 0;
  enemies = []; gems = []; items = []; projs = []; pools = []; ebullets = []; floaters = []; particles = []; orbs = []; drones = []; minions = []; lasers = []; bolts = []; drillList = []; hazards = [];
  cam = {x:0, y:0}; time = 0; kills = 0; spawnT = 0; bruteT = 60; titanT = 250; warlordT = 400; colossusT = 600; bossT = 180; bossN = 0; itemT = rand(30, 45); banner = 0;
  state = 'play';
}

// ---------- 능력치 ----------
const lvl = k => P.w[k];
const speedOf = () => 180 * (1 + 0.03 * upLv('swift')) * (lvl('boots') >= 7 ? 2.2 : 1 + 0.12 * lvl('boots'));
const cdMul = () => lvl('clock') >= 7 ? 0.45 : 1 - 0.07 * lvl('clock');
const xpMul = () => (lvl('scroll') >= 7 ? 3 : 1 + 0.2 * lvl('scroll')) * (1 + 0.05 * upLv('learn'));
const shieldR = () => lvl('shield') >= 7 ? 340 : 60 + 30 * lvl('shield');          // 방어막 반경
const shieldSlow = () => lvl('shield') >= 7 ? 0.65 : 0.25 + 0.05 * lvl('shield');   // 적 둔화율
const calcMaxHp = () => 100 + 5 * (P.level - 1) + 10 * upLv('vitality') + 100 * Math.min(lvl('heart'), 6) + (lvl('heart') >= 7 ? 200 : 0);

// ---------- 레벨업 ----------
function openLevelUp() {
  const pool = WEAPON_KEYS.filter(k => k === 'dmgup' ? maxedCount() >= 5 : P.w[k] < MAXLV), picks = [];
  while (picks.length < 3 && pool.length) {                       // 가중치 추첨 (상점 '스킬 확률')
    const ws = pool.map(k => 1 + 0.5 * (SAVE.aff[k] || 0));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), i = 0;
    for (; i < pool.length; i++) { r -= ws[i]; if (r <= 0) break; }
    picks.push(pool.splice(Math.min(i, pool.length - 1), 1)[0]);
  }
  lvChoices = picks;
  if (lvChoices.length === 0) { P.hp = Math.min(P.maxHp, P.hp + 30); return; }
  state = 'levelup';
}
function pick(i) {
  const k = lvChoices[i]; if (!k) return;
  P.w[k]++;
  if (k === 'heart') { const old = P.maxHp; P.maxHp = calcMaxHp(); P.hp += P.maxHp - old; }
  state = 'play';
}
function xpNeed(L) {
  const base = 5 + 4.5 * L + 0.5 * L * L + 0.012 * L ** 3;
  return base * (1 + (Math.max(0, L - 10) / 15) ** 1.6);      // 10레벨 이후 점점 가파르게
}
function gainXp(v) {
  P.xp += v * xpMul();
  while (P.xp >= P.need) {
    P.xp -= P.need; P.level++; P.need = Math.floor(xpNeed(P.level));
    P.pending++;
    { const old = P.maxHp; P.maxHp = calcMaxHp(); P.hp += P.maxHp - old; }   // 레벨업: 최대 체력 +5 (그만큼 회복)
  }
}

// ---------- 적 ----------
function ringPos(extra = 40) {
  const a = Math.random() * Math.PI * 2, d = Math.hypot(W, H) / 2 + extra;
  return { x:P.x + Math.cos(a)*d, y:P.y + Math.sin(a)*d };
}
function spawnEnemy(type, at) {
  const t = ENEMY_TYPES[type], p = at || ringPos();
  const late = Math.max(0, time - 240);   // 4분까지는 체력 증가 없음 (이후 후반일수록 가파르게 강해짐)
  const big = type === 'brute' || type === 'titan' || type === 'warlord' || type === 'colossus';
  const pw = Math.max(0, powerLv() - 15);   // 스킬을 많이 모을수록 적도 단단해짐
  const scale = (big ? 1 + late / 110 + (late / 450) ** 2 : 1 + late / 220 + (late / 450) ** 2) * (1 + 0.018 * pw);
  enemies.push({ type, x:p.x, y:p.y,
    hp:t.hp*scale, maxHp:t.hp*scale, speed:t.speed*(1+Math.min(Math.max(0, time - 120)/350, 0.8)) * rand(.9,1.1),
    dmg:t.dmg * (1 + Math.max(0, time - 180) / 130) * (1 + 0.01 * pw), r:t.r, size:t.size, icon:t.icon, gem:t.gem,
    flash:0, hitCd:0, gHit:0, kx:0, ky:0, kbMul:1, ranged:t.ranged, fireT:rand(3,6) });
  if (!big && Math.random() < Math.min(0.3, Math.max(0, time - 180) / 1500)) {   // 3분~: 엘리트 (체력 3배)
    const en = enemies[enemies.length - 1];
    en.elite = true; en.hp *= 2.5; en.maxHp *= 2.5; en.dmg *= 1.3; en.size *= 1.15; en.r *= 1.1; en.gem *= 2;
  }
}
const BOSS_KITS = [
  ['dash', 'slam', 'ring'],                                   // 1 티라노: 돌진, 발구르기(범위 충격파)
  ['aimed', 'summon', 'spiral', 'ring'],                      // 2 거미 여왕: 조준 사격, 졸개 소환, 나선 탄막
  ['aimed', 'rain', 'ring', 'dash'],                          // 3 드래곤: 부채꼴 화염, 화염 낙하
  ['blink', 'rain', 'spiral', 'aimed'],                       // 4 외계 군주: 순간이동, 광선 낙하
  ['dash', 'slam', 'rain', 'spiral', 'summon', 'blink'],      // 5 죽음의 군주: 모든 패턴
];
function spawnBoss(idx) {
  const b = BOSSES[idx - 1], p = ringPos(80);
  const pw = Math.max(0, powerLv() - 10), hp = 25000 * [1.0, 1.3, 2.2, 3.0, 4.0][idx - 1] * (1 + 0.04 * pw);   // 스킬이 많을수록 보스도 단단
  enemies.push({ type:'boss', boss:true, final:idx === 5, kit:BOSS_KITS[idx - 1], name:b.name, idx, x:p.x, y:p.y, hp, maxHp:hp, speed:55 + idx*4,
    dmg:(30 + idx*8) * (1 + time / 300), r:48, size:120, icon:b.icon, gem:5, flash:0, hitCd:0, gHit:0, kx:0, ky:0, kbMul:0.05,
    atkT:3, dashT:0, windT:0, dx:0, dy:0, spiralT:0, spiralCd:0, spiralA:0 });

const magnetShare = () => lvl('magnet') >= 7 ? 0.9 : 0.35 + 0.08 * lvl('magnet');

    for (let i = 0; i < n; i++) {
      const roll = Math.random();

      if (time > 30 && roll < 0.3) type = 'dog';
      if (time > 60 && roll > 0.75) type = 'bug';
      if (time > 90 && Math.random() < Math.min(0.35, 0.12 + (time - 90) / 1500)) type = 'knight';
      if (time > 150 && Math.random() < Math.min(0.30, 0.10 + (time - 150) / 1500)) type = 'wolf';

  if (itemT <= 0) {
    const c = enemies.filter(e => !e.boss && !e.carry && dist2(P, e) < 700*700);
    if (c.length) {

  if (!bossAlive && bossT <= 0 && bossN < 5) spawnBoss(++bossN);   // 첫 보스 3분, 이후 보스 처치 5분 뒤

}

function updateDrills(dt) {
  const lv = lvl('drill');

  const evo = lv >= 7, n = evo ? 6 : lv, r = evo ? 34 : 14 + lv*1.5, dmg = evo ? 60 : 12 + lv*5, sp = evo ? 400 : 360;
  while (drillList.length < n) { const a = rand(0, 7); drillList.push({ x:P.x, y:P.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, hit:new Map() }); }
  while (drillList.length > n) drillList.pop();
  const L = cam.x - W/2, Rr = cam.x + W/2, T = cam.y - H/2, B = cam.y + H/2;
  for (const p of drillList) {
    p.r = r; p.evo = evo;
    const m = Math.hypot(p.vx, p.vy) || 1; p.vx = p.vx/m*sp; p.vy = p.vy/m*sp;
    p.x += p.vx*dt; p.y += p.vy*dt;
    let bounced = false;
    if (p.x < L + r) { p.x = L + r; p.vx = Math.abs(p.vx); bounced = true; } if (p.x > Rr - r) { p.x = Rr - r; p.vx = -Math.abs(p.vx); bounced = true; }
    if (p.y < T + r) { p.y = T + r; p.vy = Math.abs(p.vy); bounced = true; } if (p.y > B - r) { p.y = B - r; p.vy = -Math.abs(p.vy); bounced = true; }
    if (bounced) {

  const l = lvl('summoner');

  while (minions.length > n) minions.pop();

  minions.forEach((m, i) => {

    const baseDmg = golem ? 90 : evo ? 45 : 14 + l*6, baseSpd = golem ? 120 : evo ? 230 : 150 + l*10;
    const spec = { dmg:baseDmg * (golem ? 1 : ty.dmg), spd:baseSpd * (golem ? 1 : ty.spd), r:golem ? 34 : ty.r };
    m.golem = golem; m.ty = ty; m.r = spec.r;
    const tg = nearest(m, enemies, 420);

    if (tg) { tx = tg.x; ty2 = tg.y; } else { const a = time*1.2 + i*2.1; tx = P.x + Math.cos(a)*75; ty2 = P.y + Math.sin(a)*75; }
    const d = Math.hypot(tx - m.x, ty2 - m.y) || 1, v = tg ? spec.spd : Math.min(300, d*3 + 60);
    if (d > 4) { m.x += (tx - m.x)/d*v*dt; m.y += (ty2 - m.y)/d*v*dt; }
    m.face = tx >= m.x ? 1 : -1;
    m.aoeT = (m.aoeT || 0) - dt;
    if (l >= 3) {                                   // 3레벨부터: 닿으면 주변 범위 폭발
      if (m.aoeT <= 0 && enemies.some(e => dist2(m, e) < (m.r + e.r + 6)**2)) {
        m.aoeT = 0.6; explode(m.x, m.y, golem ? 130 : (55 + l*6) * ty.aoe, spec.dmg, golem ? '#38bdf8' : '#a78bfa');
      }
    } else for (const e of enemies) if (e.mHit <= 0 && dist2(m, e) < (m.r + e.r)**2) {
      damageEnemy(e, spec.dmg, (e.x - m.x)*3, (e.y - m.y)*3); e.mHit = 0.5;
    }
  });
}

function guardianSpec() {
  const g = lvl('guardian');
  if (g >= 7) return { n:6, rad:115, spd:6.5, r:27, dmg:60, cd:0.25, gear:true };
  return { n:g, rad:70 + g*3, spd:3 + g*0.3, r:11 + g, dmg:20 + g*6, cd:0.4, gear:false };
}
function droneCount() { const d = lvl('drone'); return d >= 7 ? 6 : d; }

  if (lvl('shuriken')) { P.cd.shuriken -= dt; if (P.cd.shuriken <= 0 && throwShuriken()) P.cd.shuriken = (lvl('shuriken') >= 7 ? 2.6 : 2.2 - 0.12*lvl('shuriken')) * cm; }
  if (lvl('molotov'))  { P.cd.molotov -= dt;  if (P.cd.molotov <= 0 && throwMolotov())  P.cd.molotov = (lvl('molotov') >= 7 ? 1.3 : 2.4 - 0.2*lvl('molotov')) * cm; }
  if (lvl('rocket'))   { P.cd.rocket -= dt;   if (P.cd.rocket <= 0 && fireRocket())     P.cd.rocket = (lvl('rocket') >= 7 ? 1.6 : 2.8 - 0.2*lvl('rocket')) * cm; }

  if (lvl('laser'))     { P.cd.laser -= dt;     if (P.cd.laser <= 0 && fireLaser())        P.cd.laser = (lvl('laser') >= 7 ? 5 : 3.4 - 0.22*lvl('laser')) * cm; }
  updateDrills(dt);
  if (lvl('soccer'))    { P.cd.soccer -= dt;    if (P.cd.soccer <= 0 && kickBall())        P.cd.soccer = (lvl('soccer') >= 7 ? 2.2 : 2.6 - 0.18*lvl('soccer')) * cm; }
  updateMinions(dt); updateLasers(dt);
  // 방어막
  if (lvl('shield')) {   // 방어막 안의 적에게 지속 피해
    P.spikeT -= dt;

      for (const e of enemies) if ((e.x-P.x)**2 + (e.y-P.y)**2 < (R + e.r)**2) damageEnemy(e, dmg, (e.x-P.x)*0.5, (e.y-P.y)*0.5); }
  }
  // 질풍 신발 오라
  if (lvl('boots') >= 7) {
    P.auraT -= dt;
    if (P.auraT <= 0) { P.auraT = 0.2;
      for (const e of enemies) if ((e.x-P.x)**2 + (e.y-P.y)**2 < (36 + e.r)**2) damageEnemy(e, 20, (e.x-P.x)*3, (e.y-P.y)*3); }

  orbs = [];
  const gs = guardianSpec();

      const a = P.orbAngle + i * Math.PI * 2 / gs.n;
      orbs.push({ x:P.x + Math.cos(a)*gs.rad, y:P.y + Math.sin(a)*gs.rad, r:gs.r, gear:gs.gear, rot:a*2 });
      if (gs.gear) particles.push({ x:orbs[orbs.length-1].x, y:orbs[orbs.length-1].y, vx:rand(-40,40), vy:rand(-40,40), t:0.3, c:'#ef4444' });
    }

      drones.push(d);
      P.dcd[i] = (P.dcd[i] ?? 0) - dt;
      if (P.dcd[i] <= 0) {
        const t = nearest(d, enemies, 480);
        if (t) {
          const base = Math.atan2(t.y - d.y, t.x - d.x), shots = evo ? 3 : 1 + Math.floor(dl / 2);
          for (let k = 0; k < shots; k++) {
            const ang = base + (k - (shots-1)/2) * 0.14;
            projs.push({ kind:'bolt', x:d.x, y:d.y, vx:Math.cos(ang)*620, vy:Math.sin(ang)*620, a:ang,
              dmg:evo ? 40 : 9 + dl*3, life:0.9, pierce:evo ? 3 : 0, hit:new Set(), r:evo ? 9 : 4 + dl*0.9, evo });
          }
          P.dcd[i] = (evo ? 0.2 : Math.max(0.2, 0.75 - 0.09*dl)) * cm;
        }

  }
  // 시간 정지
  if (P.freeze > 0) P.freeze -= dt;
  if (lvl('clock') >= 7) {
    P.freezeCd -= dt;
    if (P.freezeCd <= 0) { P.freezeCd = 20; P.freeze = 2.5; banner = 1.5; bannerTxt = '시간 정지!'; }

}

function updateProjs(dt) {
  for (const p of projs) {
    if (p.kind === 'kunai' || p.kind === 'bolt') {
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
      if (p.evo) particles.push({ x:p.x, y:p.y, vx:0, vy:0, t:0.25, c:p.kind === 'bolt' ? '#f6f' : '#fa8' });
      for (const e of enemies) {
        if (e.hp <= 0 || p.hit.has(e)) continue;
        if (dist2(p, e) < (p.r + e.r)**2) {
          damageEnemy(e, p.dmg, p.vx*0.05, p.vy*0.05); p.hit.add(e);
          if (p.pierce-- <= 0) { p.life = 0; break; }
        }
      }
    } else if (p.kind === 'shuriken') {
      p.t += dt; p.spin += dt * 20;
      const d = p.R * Math.sin(Math.PI * Math.min(1, p.t / p.T));
      const ang = p.a + (p.orbit ? p.t * 3.4 : 0);   // 만렙: 나가고 들어오면서 플레이어 주위를 공전
      p.x = P.x + Math.cos(ang) * d; p.y = P.y + Math.sin(ang) * d;
      if (p.t >= p.T) p.life = 0;
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        const last = p.hit.get(e);
        if ((last === undefined || time - last > 0.35) && dist2(p, e) < (p.r + e.r)**2) {
          damageEnemy(e, p.dmg, Math.cos(p.a)*60, Math.sin(p.a)*60); p.hit.set(e, time);
        }
      }
    } else if (p.kind === 'ball') {
      p.t += dt; p.life -= dt;
      if (!p.target || p.target.hp <= 0) {
        p.target = nearest(p, enemies.filter(e => e !== p.last && e.hp > 0), 380);
        if (!p.target) { p.life = 0; continue; }
      }
      const dx = p.target.x - p.x, dy = p.target.y - p.y, d = Math.hypot(dx, dy) || 1;
      p.x += dx/d*p.spd*dt; p.y += dy/d*p.spd*dt;
      particles.push({ x:p.x, y:p.y, vx:0, vy:0, t:0.2, c:p.evo ? '#fb923c' : '#fff' });
      if (d < p.r + p.target.r + 4) {
        const e = p.target;
        damageEnemy(e, p.dmg, dx/d*160, dy/d*160);
        if (p.evo) explode(e.x, e.y, 70, 60, '#fb923c');
        for (let i = 0; i < 4; i++) particles.push({ x:e.x, y:e.y, vx:rand(-120,120), vy:rand(-120,120), t:0.25, c:'#fff' });
        p.last = e; p.target = null; p.bounces--;
        if (p.bounces < 0) p.life = 0;
      }
    } else if (p.kind === 'brick') {
      p.t += dt; const k = Math.max(0, Math.min(1, p.t / p.dur));
      p.h = (1 - k) * p.h0;
      if (k >= 1) {
        const evo = p.lv >= 7;
        explode(p.tx, p.ty, evo ? 115 : 40 + p.lv*5, evo ? 220 : 35 + p.lv*14, '#d9a066');
        if (evo) { particles.push({ x:p.tx, y:p.ty, ring:160, t:0.4, tmax:0.4, c:'#fff' }); for (let i = 0; i < 10; i++) particles.push({ x:p.tx, y:p.ty, vx:rand(-220,220), vy:rand(-220,-40), t:0.5, c:'#9aa3b2' }); }
        for (let i = 0; i < 6; i++) particles.push({ x:p.tx, y:p.ty, vx:rand(-120,120), vy:rand(-160,-40), t:0.4, c:'#c9633d' });
        p.life = 0;
      }
    } else if (p.kind === 'molotov') {
      p.t += dt; const k = Math.min(1, p.t / p.dur);
      p.x = p.sx + (p.tx - p.sx)*k; p.y = p.sy + (p.ty - p.sy)*k - Math.sin(k*Math.PI)*60;
      if (k >= 1) {
        const evo = p.lv >= 7;
        pools.push({ x:p.tx, y:p.ty, r:evo ? 210 : 70 + p.lv*12, t:evo ? 5 : 3, tick:0, dmg:evo ? 60 : 12 + p.lv*6, blue:evo });
        p.life = 0;
      }
    } else if (p.kind === 'rocket') {
      if (!p.target || p.target.hp <= 0) p.target = nearest(p, enemies);
      if (p.target) {
        const want = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        let d = want - p.a; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI;
        p.a += Math.max(-4*dt, Math.min(4*dt, d));
      }
      p.spd = Math.min(420, p.spd + 250*dt);
      p.x += Math.cos(p.a)*p.spd*dt; p.y += Math.sin(p.a)*p.spd*dt; p.life -= dt;
      particles.push({ x:p.x, y:p.y, vx:0, vy:0, t:0.25, c:p.lv >= 7 ? '#fb923c' : '#999' });
      let boom = p.life <= 0;
      for (const e of enemies) if (e.hp > 0 && dist2(p, e) < (p.r + e.r)**2) { boom = true; break; }
      if (boom) {
        if (p.lv >= 7) {
          explode(p.x, p.y, 140, 180);

        } else explode(p.x, p.y, 70 + p.lv*10, 50 + p.lv*20);
        p.life = 0;
      }
    }
  }
  projs = projs.filter(p => (p.life === undefined) || p.life > 0);
  for (const f of pools) {
    f.t -= dt; f.tick -= dt;
    if (f.tick <= 0) {
      f.tick = 0.3;
      for (const e of enemies) if ((e.x-f.x)**2 + (e.y-f.y)**2 < (f.r + e.r)**2) damageEnemy(e, f.dmg);
    }
  }
  pools = pools.filter(f => f.t > 0);
}

// ---------- 갱신 ----------
function update(dt) {
  time += dt;
  P.bonusT = (P.bonusT || 0) + dt;                       // 생존 보너스: 20초마다 +1골드 (즉시 저장)
  if (P.bonusT >= 20) { P.bonusT -= 20; P.bonusGold = (P.bonusGold || 0) + 1; SAVE.gold++; persist(); }

  let dx = (keys['d']||keys['arrowright']?1:0) - (keys['a']||keys['arrowleft']?1:0);
  let dy = (keys['s']||keys['arrowdown']?1:0) - (keys['w']||keys['arrowup']?1:0);
  const m = Math.hypot(dx, dy);
  if (m) { dx /= m; dy /= m; P.x += dx*speedOf()*dt; P.y += dy*speedOf()*dt; if (dx) P.face = dx > 0 ? 1 : -1; }
  P.hurtT -= dt; P.inv -= dt;
  if (lvl('boots') >= 7) { P.trailT -= dt; if (P.trailT <= 0) { P.trailT = 0.04; P.trail.unshift({ x:P.x, y:P.y, face:P.face }); if (P.trail.length > 6) P.trail.pop(); } } else P.trail.length = 0;
  if (lvl('heart') >= 7 && Math.random() < dt * 3) particles.push({ x:P.x + rand(-22,22), y:P.y, vx:0, vy:-45, t:0.8, c:'#ff7ab0' });
  if (lvl('heart') >= 7) P.hp = Math.min(P.maxHp, P.hp + 2*dt);
  cam.x += (P.x - cam.x) * Math.min(1, dt*8); cam.y += (P.y - cam.y) * Math.min(1, dt*8);
  if (banner > 0) banner -= dt;

  director(dt);
  updateWeapons(dt);
  updateProjs(dt);
  const frozen = P.freeze > 0;

  // 적 이동·충돌
  for (const e of enemies) {
    const d = Math.hypot(P.x - e.x, P.y - e.y) || 1;
    e.flash -= dt; e.hitCd -= dt;
    if (!frozen) {
      const dashing = e.boss ? bossAI(e, dt) : false;
      if (!dashing) { const slow = lvl('shield') && d < shieldR() + e.r ? 1 - shieldSlow() : 1;
        const mv = (e.ranged && d < 260 ? 0 : 1) * slow; e.x += (P.x - e.x)/d * e.speed * dt * mv; e.y += (P.y - e.y)/d * e.speed * dt * mv; }
      if (e.ranged) { e.fireT -= dt; if (e.fireT <= 0 && d < 520) { e.fireT = 5.5; ebullets.push({ x:e.x, y:e.y, vx:(P.x-e.x)/d*230, vy:(P.y-e.y)/d*230, life:4, r:8, dmg:e.dmg, green:true }); } }
    }
    e.x += e.kx * dt; e.y += e.ky * dt;
    e.kx *= Math.pow(0.02, dt); e.ky *= Math.pow(0.02, dt);
    if (!frozen && e.hp > 0 && d < e.r + P.r && e.hitCd <= 0) {
      e.hitCd = 0.7;
      hurtPlayer(e.dmg);
    }
  }
  // 적끼리 겹침 완화
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.boss) continue;
    for (let j = i + 1; j < Math.min(enemies.length, i + 12); j++) {
      const b = enemies[j]; if (b.boss) continue;
      const ddx = b.x - a.x, ddy = b.y - a.y, min = (a.r + b.r) * 0.8, dd = ddx*ddx + ddy*ddy;
      if (dd < min*min && dd > 0.01) { const d = Math.sqrt(dd), push = (min - d) * 0.3;
        a.x -= ddx/d*push; a.y -= ddy/d*push; b.x += ddx/d*push; b.y += ddy/d*push; }
    }
  }
  for (const e of enemies) if (e.hp <= 0) killEnemy(e);
  enemies = enemies.filter(e => e.hp > 0);

  if (!frozen) for (const h of hazards) {            // 보스 예고 공격 (붉은 원) 폭발
    h.t -= dt;
    if (h.t <= 0) {
      h.done = true;
      if (dist2(h, P) < (h.r + P.r)**2) hurtPlayer(h.dmg);
      particles.push({ x:h.x, y:h.y, ring:h.r, t:0.35, tmax:0.35, c:'#f66' });
      for (let i = 0; i < 6; i++) particles.push({ x:h.x, y:h.y, vx:rand(-160,160), vy:rand(-160,160), t:0.35, c:'#fa8' });
    }
  }
  hazards = hazards.filter(h => !h.done);
  // 적 탄환
  for (const b of ebullets) {
    const bs = lvl('shield') && dist2(b, P) < shieldR()**2 ? 1 - shieldSlow() : 1;   // 방어막 안 탄환 둔화
    b.x += b.vx*dt*bs; b.y += b.vy*dt*bs; b.life -= dt;
    if (dist2(b, P) < (b.r + P.r)**2) { b.life = 0; hurtPlayer(b.dmg || 10); }
  }
  ebullets = ebullets.filter(b => b.life > 0);

  // 보석
  const magnet = (lvl('magnet') >= 7 ? 700 : (80 + P.level * 2) * (1 + 0.25 * lvl('magnet'))) + (lvl('scroll') >= 7 ? 320 : 0);   // 비전서 + 자석 범위가 합산
  for (const g of gems) {
    const d = Math.hypot(P.x - g.x, P.y - g.y) || 1;
    if (d < magnet || g.pull) { g.pull = true; g.x += (P.x-g.x)/d * 420 * dt; g.y += (P.y-g.y)/d * 420 * dt; }
    if (d < P.r + 6) { g.dead = true; gainXp(g.v); }
  }
  gems = gems.filter(g => !g.dead);
  if (gems.length > 600) gems.splice(0, gems.length - 600);

  // 아이템
  for (const it of items) if (it.kind === 'coin') {                 // 코인은 가까이 가면 끌려옴
    const d = Math.hypot(P.x - it.x, P.y - it.y) || 1;
    if (d < magnet * 0.7 || it.pull) { it.pull = true; it.x += (P.x - it.x)/d * 460 * dt; it.y += (P.y - it.y)/d * 460 * dt; }
  }
  for (const it of items) if (dist2(P, it) < (P.r + 16)**2) {
    it.dead = true;
    if (it.kind === 'meat') { P.hp = Math.min(P.maxHp, P.hp + 30); floaters.push({ x:P.x, y:P.y - 20, txt:'+30', t:0.8 }); }
    else if (it.kind === 'magnet') { for (const g of gems) g.pull = true; for (const i of items) if (i.kind === 'coin') i.pull = true; }
    else if (it.kind === 'coin') { P.gold += it.v; SAVE.gold += it.v; persist(); floaters.push({ x:P.x, y:P.y - 24, txt:'+' + it.v, t:0.7, gold:true }); }
    else if (it.kind === 'chest') P.pending++;
  }
  items = items.filter(i => !i.dead);

  if (P.pending > 0 && state === 'play') { P.pending--; openLevelUp(); }

  for (const b of bolts) b.t -= dt;
  bolts = bolts.filter(b => b.t > 0);
  for (const f of floaters) { f.t -= dt; f.y -= 30*dt; }
  floaters = floaters.filter(f => f.t > 0);
  for (const p of particles) { p.t -= dt; if (p.vx) { p.x += p.vx*dt; p.y += p.vy*dt; } }
  particles = particles.filter(p => p.t > 0);
}

// ---------- 그리기 ----------
function emoji(ch, x, y, size, flip, rot = 0) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (flip) ctx.scale(-1, 1);
  ctx.font = size + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, 0, 0); ctx.restore();
}
function bar(x, y, w, h, frac, col, bg = '#0008') {
  ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w*Math.max(0, Math.min(1, frac)), h);
}
function star(x, y, r, rot, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = col; ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const rr = i % 2 ? r*0.35 : r, a = i * Math.PI / 4; ctx.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}

// ---------- 벡터 아이콘 ----------
// 모든 아이콘은 -1~1 단위 좌표계로 그린다 (icon()이 크기에 맞게 스케일)
const OUT = '#12161d';
function sh(fill, fn, lw = 0.13) {
  ctx.beginPath(); fn();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
}
const poly = pts => pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
const circ = (x, y, r) => { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); };
const ell = (x, y, rx, ry, rot = 0) => { ctx.moveTo(x + rx*Math.cos(rot), y + rx*Math.sin(rot)); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); };
function ln(x1, y1, x2, y2, col, lw) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function starPts(n, R, r, rot = 0) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n - Math.PI / 2, rr = i % 2 ? r : R; pts.push([Math.cos(a)*rr, Math.sin(a)*rr]); }
  return pts;
}
function flameShape(outer, inner) {
  const path = k => { ctx.moveTo(0, -1*k); ctx.bezierCurveTo(.2*k, -.5*k, .8*k, -.2*k, .7*k, .4*k);
    ctx.bezierCurveTo(.6*k, .9*k, -.6*k, .9*k, -.7*k, .4*k); ctx.bezierCurveTo(-.8*k, -.1*k, -.2*k, -.3*k, 0, -1*k); };
  sh(outer, () => path(1));
  ctx.save(); ctx.translate(0, .25); sh(inner, () => path(.55), 0.0001); ctx.restore();
}
function kun() {
  sh('#cfd8e3', () => poly([[0,-1],[.28,-.2],[.12,.1],[-.12,.1],[-.28,-.2]]));
  ln(0, -.85, 0, .02, '#8fa0b5', .06);
  sh('#7a2e2e', () => poly([[-.1,.1],[.1,.1],[.1,.62],[-.1,.62]]));
  ln(-.1, .25, .1, .2, '#e7b3b3', .05); ln(-.1, .42, .1, .37, '#e7b3b3', .05);
  sh(null, () => circ(0, .8, .2), .1);
}
function gearShape(rim, ring) {
  sh(rim, () => { const pts = [];
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4;
      [[-.2,.78],[-.12,1],[.12,1],[.2,.78]].forEach(([da, r]) => pts.push([Math.cos(a+da)*r, Math.sin(a+da)*r])); }
    poly(pts); });
  sh(ring, () => circ(0, 0, .62));
  sh('#2a303b', () => circ(0, 0, .28));
}
function shieldPath(k) {
  ctx.moveTo(-.75*k, -.8*k); ctx.lineTo(.75*k, -.8*k); ctx.lineTo(.75*k, 0);
  ctx.quadraticCurveTo(.75*k, .65*k, 0, 1*k); ctx.quadraticCurveTo(-.75*k, .65*k, -.75*k, 0); ctx.closePath();
}
function heartPath() {
  ctx.moveTo(0, .85); ctx.bezierCurveTo(-1.2, 0, -.8, -.9, 0, -.4); ctx.bezierCurveTo(.8, -.9, 1.2, 0, 0, .85);
}
function wing(dir) {
  ctx.save(); ctx.scale(dir, 1);
  sh('#f8fafc', () => poly([[.45,-.1],[1,-.8],[1,-.3],[1.1,0],[.9,.2],[.45,.3]]));
  ln(.55, -.05, .95, -.5, '#cbd5e1', .05);
  ctx.restore();
}

    const px = cx0 + dx*k, py = cy0 + dy*k, a = Math.atan2(dy, dx), pulse = 1 + Math.sin(time*8)*0.08, col = ARC[it.kind] || '#fff';
    ctx.save(); ctx.translate(px, py);
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 22*pulse, 0, 7); ctx.fill(); ctx.stroke();
    icon(it.kind, 0, 0, 28);
    ctx.rotate(a); ctx.fillStyle = col; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(38, 0); ctx.lineTo(26, -10); ctx.lineTo(26, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  if (banner > 0) { ctx.globalAlpha = Math.min(1, banner); text(bannerTxt, W/2, H/3, 34, '#ffd54a'); ctx.globalAlpha = 1; }
}

function drawLevelUp() {
  ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, W, H);
  text('LEVEL UP!', W/2, H/2 - 150, 44, '#ffd54a');
  text('보상을 선택하세요 (클릭 또는 1·2·3)', W/2, H/2 - 115, 16, '#ccc');

  lvChoices.forEach((k, i) => {

    cardRects.push({ x, y, w:cw, h:ch });

    const u = UPGRADES[k], lv = P.w[k], evo = lv === 6 && !!u.evo;
    ctx.fillStyle = hover ? '#3a4a6a' : evo ? '#4a3a1a' : '#26304a';
    ctx.strokeStyle = hover || evo ? '#ffd54a' : '#556'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(x, y, cw, ch, 12); ctx.fill(); ctx.stroke();
    const shown = evo ? u.evo : u;

    ctx.fillStyle = evo ? '#ffd54a33' : '#ffffff14'; ctx.beginPath(); ctx.arc(x + cw/2, y + 70, 46, 0, 7); ctx.fill(); icon(shown.icon, x + cw/2, y + 70, 64);
    text(shown.name, x + cw/2, y + 125, 21, evo ? '#ffd54a' : '#fff');
    text(lv === 0 ? 'NEW!' : evo ? '★ 진화! MAX' : `Lv ${lv} → ${lv+1}`, x + cw/2, y + 150, 15, lv === 0 ? '#7f7' : '#ffd54a');
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#ddd'; ctx.textAlign = 'center';
    const words = (evo ? u.evo.desc : u.desc(lv)).split(' '); let line = '', yy = y + 178;
    for (const w of words) { const t = line + w + ' '; if (ctx.measureText(t).width > cw - 24) { ctx.fillText(line, x + cw/2, yy); line = w + ' '; yy += 18; } else line = t; }
    ctx.fillText(line, x + cw/2, yy);

}

let hudRects = [], infoKey = null, infoFrom = 'play';
let btns = [], shopTab = 0, shopFrom = 'title', shopMsg = '', shopMsgT = 0;
function button(label, x, y, w, h, fn, col = '#2f6fdd') {
  const hover = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  ctx.fillStyle = hover ? '#ffffff30' : '#00000055'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
  ctx.fillStyle = col + (hover ? 'ff' : 'cc'); ctx.beginPath(); ctx.roundRect(x + 3, y + 3, w - 6, h - 6, 8); ctx.fill();
  text(label, x + w/2, y + h/2 + 7, 18);
  btns.push({ x, y, w, h, fn });
}
function openShop() { shopFrom = state; state = 'shop'; shopMsg = ''; }
function closeShop() { state = shopFrom; }

const EQUIP = [
  { id:'armor',    name:'갑옷',       icon:'armor',  desc:'받는 피해 -4%',        max:5,  cost:l => 400*(l+1) },
  { id:'vitality', name:'체력 단련',   icon:'heart',  desc:'최대 체력 +10',        max:10, cost:l => 200*(l+1) },
  { id:'power',    name:'힘의 단련',   icon:'kunai',  desc:'모든 피해 +5%',        max:10, cost:l => 300*(l+1) },
  { id:'swift',    name:'가벼운 신발', icon:'boots',  desc:'이동속도 +3%',         max:5,  cost:l => 250*(l+1) },
  { id:'learn',    name:'수련',       icon:'scroll', desc:'경험치 획득 +5%',      max:10, cost:l => 220*(l+1) },
  { id:'greed',    name:'탐욕',       icon:'coin',   desc:'골드 획득 +10%',       max:5,  cost:l => 300*(l+1) },

const AFFINITY = () => WEAPON_KEYS.filter(k => k !== 'dmgup').map(k => ({ id:k, name:UPGRADES[k].name, icon:UPGRADES[k].icon, desc:'레벨업 시 등장 확률 +50%', max:3, cost:l => 350*(l+1), store:'aff' }));

const CHARS = [
  { id:'ninja',    name:'닌자',        icon:'ninja',     start:'kunai',     cost:0,    desc:'균형 잡힌 기본 캐릭터' },

  { id:'striker',  name:'축구 스타',    icon:'striker',   start:'soccer',    cost:5000, desc:'축구공으로 시작' },
  { id:'miner',    name:'드릴 광부',    icon:'miner',     start:'drill',     cost:6500, desc:'드릴샷으로 시작' },

];
const curChar = () => CHARS.find(c => c.id === SAVE.char) || CHARS[0];
const charIcon = () => curChar().icon;
let shopScroll = 0, shopMax = 0;

function buyItem(e) {
  const lv = SAVE[e.store][e.id] || 0;
  if (lv >= e.max) { shopMsg = '이미 최대 레벨입니다'; }
  else if (SAVE.gold < e.cost(lv)) { shopMsg = '골드가 부족합니다'; }
  else { SAVE.gold -= e.cost(lv); SAVE[e.store][e.id] = lv + 1; persist(); shopMsg = e.name + ' 구매 완료!'; }
  shopMsgT = 2;
}
function resetItem(e) {                 // 초기화: 지금까지 쓴 골드를 전액 환급
  const lv = SAVE[e.store][e.id] || 0; if (!lv) return;
  let refund = 0; for (let i = 0; i < lv; i++) refund += e.cost(i);
  SAVE.gold += refund; SAVE[e.store][e.id] = 0; persist();
  shopMsg = e.name + ' 초기화 (+' + refund + ' 골드 환급)'; shopMsgT = 2;
}
function pickChar(c) {
  if (SAVE.chars[c.id]) { SAVE.char = c.id; shopMsg = c.name + ' 장착!'; }
  else if (SAVE.gold < c.cost) shopMsg = '골드가 부족합니다';
  else { SAVE.gold -= c.cost; SAVE.chars[c.id] = true; SAVE.char = c.id; shopMsg = c.name + ' 구매 & 장착!'; }
  persist(); shopMsgT = 2;
}
function drawShop() {
  ctx.fillStyle = '#1b2a3a'; ctx.fillRect(0, 0, W, H);
  text('상점', W/2, 60, 42, '#ffd54a');
  icon('coin', W/2 - 50, 98, 26); text(String(SAVE.gold), W/2 - 32, 106, 24, '#ffd54a', 'left');
  const tabs = ['장비 [1]', '스킬 확률 [2]', '캐릭터 [3]'], bw = 150, tg = 10, tx0 = W/2 - (tabs.length*bw + (tabs.length-1)*tg)/2;
  tabs.forEach((t, i) => button(t, tx0 + i*(bw+tg), 124, bw, 38, () => { shopTab = i; shopScroll = 0; }, shopTab === i ? '#e0932b' : '#475569'));
  const v0 = 176, v1 = H - 70;
  const list = shopTab === 0 ? EQUIP : shopTab === 1 ? AFFINITY() : CHARS;
  const cw = 250, gap = 14, ch = 104, cols = Math.max(1, Math.min(4, Math.floor((W - 30) / (cw + gap)))), rows = Math.ceil(list.length / cols);
  const total = cols * cw + (cols - 1) * gap;
  shopMax = Math.max(0, rows * (ch + gap) + 10 - (v1 - v0)); shopScroll = Math.max(0, Math.min(shopMax, shopScroll));
  ctx.save(); ctx.beginPath(); ctx.rect(0, v0, W, v1 - v0); ctx.clip();
  list.forEach((e, i) => {
    const x = W/2 - total/2 + (i % cols) * (cw + gap), y = v0 + 6 + Math.floor(i / cols) * (ch + gap) - shopScroll;
    if (y > v1 || y + ch < v0) return;
    const inView = mouse.y >= v0 && mouse.y <= v1;
    const hover = inView && mouse.x >= x && mouse.x <= x + cw && mouse.y >= y && mouse.y <= y + ch;
    const isChar = shopTab === 2;
    const lv = isChar ? 0 : (SAVE[e.store][e.id] || 0), maxed = !isChar && lv >= e.max, price = isChar ? e.cost : maxed ? 0 : e.cost(lv);
    const owned = isChar && !!SAVE.chars[e.id], equipped = isChar && SAVE.char === e.id;
    const can = isChar ? (owned || SAVE.gold >= price) : (!maxed && SAVE.gold >= price);
    ctx.fillStyle = hover ? '#34506e' : '#26384f'; ctx.strokeStyle = (maxed || equipped) ? '#ffd54a' : can ? '#6fd36f' : '#556'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(x, y, cw, ch, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff14'; ctx.beginPath(); ctx.arc(x + 36, y + ch/2, 28, 0, 7); ctx.fill();
    icon(e.icon, x + 36, y + ch/2, isChar ? 50 : 38);
    text(e.name, x + 72, y + 26, 17, '#fff', 'left');
    ctx.font = '12px sans-serif'; ctx.fillStyle = '#c9d6e6'; ctx.textAlign = 'left';
    if (isChar) {
      ctx.fillText(e.desc, x + 72, y + 46);
      text('시작 스킬: ' + UPGRADES[e.start].name, x + 72, y + 66, 13, '#9fe29f', 'left');
      if (equipped) text('장착 중', x + cw - 12, y + ch - 12, 15, '#ffd54a', 'right');
      else if (owned) text('장착하기', x + cw - 12, y + ch - 12, 15, '#9fe29f', 'right');
      else { icon('coin', x + cw - 74, y + ch - 20, 16); text(String(price), x + cw - 12, y + ch - 14, 15, can ? '#ffd54a' : '#e57373', 'right'); }
    } else {
      ctx.fillText(e.desc, x + 72, y + 46);
      text('Lv ' + lv + '/' + e.max, x + 72, y + 66, 13, '#ffd54a', 'left');
      if (maxed) text('MAX', x + cw - 12, y + ch - 12, 15, '#ffd54a', 'right');
      else { icon('coin', x + cw - 74, y + ch - 20, 16); text(String(price), x + cw - 12, y + ch - 14, 15, can ? '#ffd54a' : '#e57373', 'right'); }
      if (lv > 0) {                                     // 항목별 초기화 버튼
        const rx = x + cw - 66, ry = y + 8, rh = 22, rhov = inView && mouse.x >= rx && mouse.x <= rx + 58 && mouse.y >= ry && mouse.y <= ry + rh;
        ctx.fillStyle = rhov ? '#c0392b' : '#7a2e2e'; ctx.beginPath(); ctx.roundRect(rx, ry, 58, rh, 6); ctx.fill();
        text('초기화', rx + 29, ry + 16, 12, '#fff');
        btns.push({ x:rx, y:ry, w:58, h:rh, fn:() => resetItem(e), y0:v0, y1:v1 });
      }
    }
    btns.push({ x, y, w:cw, h:ch, fn:() => isChar ? pickChar(e) : buyItem(e), y0:v0, y1:v1 });
  });
  ctx.restore();
  if (shopMax > 0) {                                    // 스크롤바
    const th = Math.max(30, (v1 - v0) * (v1 - v0) / (shopMax + v1 - v0)), ty = v0 + (v1 - v0 - th) * (shopScroll / shopMax);
    ctx.fillStyle = '#ffffff22'; ctx.fillRect(W - 12, v0, 6, v1 - v0); ctx.fillStyle = '#ffd54acc'; ctx.fillRect(W - 12, ty, 6, th);
    text('▼ 스크롤 (마우스 휠 / ↑↓)', W/2, v1 - 6, 12, '#ffffff88');
  }
  if (shopMsgT > 0) { shopMsgT -= 1/60; text(shopMsg, W/2, H - 76, 18, '#fff'); }
  button('돌아가기 [Esc]', W/2 - 90, H - 56, 180, 42, closeShop, '#475569');
}

function wrapText(str, x, y, maxW, lh, col) {
  ctx.font = '14px sans-serif'; ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let line = '';
  for (const ch of str) {
    if (ctx.measureText(line + ch).width > maxW) { ctx.fillText(line, x, y); line = ch === ' ' ? '' : ch; y += lh; } else line += ch;
  }
  ctx.fillText(line, x, y); return y + lh;
}
function drawInfo() {
  ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, W, H);
  const k = infoKey, u = UPGRADES[k], lv = P.w[k], evo = lv >= MAXLV && !!u.evo;
  const cw = Math.min(500, W - 40), x = W/2 - cw/2, y = H/2 - 170, ch = 340;
  ctx.fillStyle = evo ? '#4a3a1a' : '#26304a'; ctx.strokeStyle = '#ffd54a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x, y, cw, ch, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffffff14'; ctx.beginPath(); ctx.arc(x + 62, y + 62, 40, 0, 7); ctx.fill();
  icon(evo ? u.evo.icon : u.icon, x + 62, y + 62, 56);
  text(evo ? u.evo.name : u.name, x + 118, y + 52, 26, evo ? '#ffd54a' : '#fff', 'left');
  text(evo ? 'MAX (진화)' : u.evo ? 'Lv ' + lv + ' / ' + MAXLV : 'Lv ' + lv, x + 118, y + 80, 15, '#ffd54a', 'left');
  let yy = y + 120;
  yy = wrapText('기본 효과: ' + u.desc(0), x + 24, yy, cw - 48, 20, '#e6edf7') + 6;
  if (!evo) yy = wrapText(lv === 6 && u.evo ? '다음 레벨: 진화 → ' + u.evo.name : '레벨업 시: ' + u.desc(1), x + 24, yy, cw - 48, 20, '#9fe29f') + 6;
  if (u.evo) yy = wrapText((evo ? '진화 효과: ' : '7레벨 진화 [' + u.evo.name + ']: ') + u.evo.desc, x + 24, yy, cw - 48, 20, '#ffd54a');
  else wrapText('스킬 5개를 MAX(7레벨)로 만들면 등장하며, 레벨 제한이 없습니다.', x + 24, yy, cw - 48, 20, '#ffd54a');
  text('클릭하거나 Esc로 닫기', W/2, y + ch - 16, 14, '#aab', 'center');
}

  button('다시 시작 [R]', W/2 - 170, H/2 + 105, 160, 46, start, '#2f9e5b');

}

function drawTitle() {
  ctx.fillStyle = '#1b261b'; ctx.fillRect(0, 0, W, H);
  text('탕탕', W/2, H/2 - 70, 80, '#ffd54a');

  text('WASD / 방향키로 이동 · 무기는 자동 발사', W/2, H/2 + 20, 16, '#ccc');
  icon('coin', W/2 - 56, H/2 + 56, 22); text(String(SAVE.gold), W/2 - 40, H/2 + 63, 20, '#ffd54a', 'left');
  button('시작 [Enter]', W/2 - 170, H/2 + 85, 160, 48, start, '#2f9e5b');

  icon(charIcon(), W/2, H/2 + 200, 64);
}

// ---------- 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  btns = [];
  if (state === 'title') drawTitle();
  else if (state === 'shop') drawShop();
  else {
    if (state === 'play') update(dt);
    drawWorld(); drawHUD();
    if (state === 'levelup') drawLevelUp();
    if (state === 'over') drawOver();
    if (state === 'win') drawWin();
    if (state === 'pause') drawPause();
    if (state === 'info') drawInfo();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
